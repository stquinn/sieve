name: diag-image

# Throwaway diagnostic for sieve#136: what does the published sieve-ci image
# hold at /homeless-shelter, the fake HOME Nix refuses to build beside? Runs
# on dispatch and whenever this file changes; delete once answered.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.forgejo/workflows/diag-image.yml]

jobs:
  inspect:
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:latest
    steps:
      - run: |
          echo "image tag resolved by the mirror: $(cat /etc/ci-base/tag 2>/dev/null || echo unknown)"
          ls -ld /homeless-shelter 2>&1 || true
          find /homeless-shelter -maxdepth 4 -exec ls -ld {} \; 2>/dev/null || true
          echo "--- store paths mentioning telemetry or homeless ---"
          ls /nix/store | grep -iE 'telemetry|homeless' || echo none
          echo "--- HOME=$HOME  USER=$USER ---"
          ls -la /root 2>/dev/null | head
