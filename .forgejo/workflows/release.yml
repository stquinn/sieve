name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # flake.nix's sieveVersion is what a Nix install reports; a tag that does
      # not match it would ship two different version numbers.
      - name: flake version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "sieveVersion = \"$want\";" flake.nix \
            || { echo "flake.nix sieveVersion != $want — bump it before tagging"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"
          tar -czf sieve-linux-amd64.tar.gz -C build/bin sieve

      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"draft\": false}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" | jq -r '.id')
          curl -sf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@sieve-linux-amd64.tar.gz" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$RELEASE_ID/assets"

