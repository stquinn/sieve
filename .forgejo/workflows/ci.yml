name: CI

# Continuous build: the Go + frontend test suites on every PR and on pushes to
# main, so a regression turns the pipeline red.
#
# Every job runs in stephen/sieve-ci, the image publish-ci-image.yml builds from
# this repo's flake. The toolchain is the devShell — go, node, wails, GTK/WebKit
# headers — already in the image's store, so a step is `nix develop --offline -c
# <cmd>` and there is no setup-go, no setup-node and no apt. Go module and npm
# downloads still use the network; only the toolchain is offline.
#
# Forgejo looks for workflows in .forgejo/workflows, then .gitea/workflows, then
# .github/workflows, and uses the FIRST directory that exists — so this directory
# is the only one it reads. .github/workflows holds just the macOS release build,
# which needs a GitHub-hosted Mac runner.
#
# Pulls go through the in-cluster proxy of the Forgejo registry: the instance
# requires sign-in for every pull and a job's image pull carries no credentials.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-go:
    name: Go Tests (CGO disabled)
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: go vet
        run: nix develop --offline -c env CGO_ENABLED=0 go vet ./...

      - name: go test
        run: nix develop --offline -c env CGO_ENABLED=0 go test ./...

  build-go:
    name: Go Build (Wails / GTK)
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # The repo-root package (main.go/app.go) is a Wails app → CGO + WebKitGTK
      # at compile time. The devShell's PKG_CONFIG_PATH points at them.
      - name: go build
        run: nix develop --offline -c go build -tags webkit2_41 ./...

  frontend:
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: nix develop --offline -c npm ci

      - name: vitest
        working-directory: frontend
        run: nix develop --offline -c npm test

  # Third-party credits staleness gate. third-party-licenses.json is generated
  # (tools/gencredits) and go:embed'ed; the release pipeline ships whatever is
  # committed, so this job regenerates it and fails if a dependency change
  # landed without regenerating the artifact. Deliberately NOT part of the
  # release build — releases must stay offline-reproducible and ship the
  # reviewed artifact.
  credits:
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_BASE="HEAD~1"
            else
              DIFF_BASE="HEAD"
            fi
          fi

          CHANGED=$(git diff --name-only $DIFF_BASE HEAD | grep -E '^(go\.mod|go\.sum|frontend/package-lock\.json|frontend/package\.json|frontend/tiptap-bundle-entry\.js|tools/gencredits/|third-party-licenses\.json)' || true)

          if [ -n "$CHANGED" ]; then
            echo "credits=true" >> $GITHUB_OUTPUT
          else
            echo "credits=false" >> $GITHUB_OUTPUT
          fi

      - name: Install frontend dependencies
        if: steps.filter.outputs.credits == 'true'
        working-directory: frontend
        run: nix develop --offline -c npm ci

      # go-licenses fetches over the network; --offline is the Nix store, not
      # the step.
      - name: Regenerate credits
        if: steps.filter.outputs.credits == 'true'
        run: nix develop --offline -c go run ./tools/gencredits

      - name: Fail if committed artifact is stale
        if: steps.filter.outputs.credits == 'true'
        run: git diff --exit-code third-party-licenses.json
