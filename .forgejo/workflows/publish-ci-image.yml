# Build the sieve-ci image from this repo's flake, push it under a unique tag,
# prove that tag runs a job, and only then move `latest`.
#
# The tag is the Nix output hash of the image, so it changes only when the
# image's contents change. A flake.nix edit that leaves the closure alone (a
# vendorHash or sieveVersion bump) finds its tag already in the registry, skips
# the build and the probe, and just re-points `latest`.
#
# The image is ci-base's package list plus this devShell's whole closure and
# every locked flake input, so the CI jobs in ci.yml enter the devShell with
# nothing to fetch. Anything that changes the closure — flake.nix or flake.lock
# — comes through here; ci.yml runs once against the previous image meanwhile.
#
# Layers are pushed zstd-compressed: the pull onto a runner node is bound by
# per-layer decompression and extraction, not the LAN, and zstd inflates several
# times faster than gzip. The probe job is the first pull of every tag, so a
# runner that could not read the format would fail there, before promote.
name: publish-ci-image
on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, .forgejo/workflows/publish-ci-image.yml]
  workflow_dispatch:

env:
  REGISTRY: git.stephenquinn.ie
  IMAGE: stephen/sieve-ci
  # Pull path for jobs: the in-cluster pull-through proxy of the registry. The
  # instance requires sign-in for every pull, and a job's image pull carries no
  # credentials, so it goes through the proxy, which holds its own.
  MIRROR: registry-mirror.image-repository.svc.cluster.local:5002

jobs:
  publish:
    runs-on: nix
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: build and push
        id: build
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job runs on the bare ci-base with no ssh key, and evaluating
          # the flake fetches the ci-base input over https. Nix's git fetcher
          # reads a netrc, not git's credential helpers.
          printf 'machine git.stephenquinn.ie login oauth2 password %s\n' "$GITHUB_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          mkdir -p /var/tmp # skopeo spools the archive here
          TAG="$(basename "$(nix eval --raw --netrc-file ~/.netrc .#ci-image.outPath)" | cut -d- -f1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if nix run nixpkgs#skopeo -- --insecure-policy inspect --creds "stephen:$REGISTRY_TOKEN" \
               "docker://$REGISTRY/$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$REGISTRY/$IMAGE:$TAG already published; image unchanged"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "building $REGISTRY/$IMAGE:$TAG"
          nix run --netrc-file ~/.netrc .#ci-image | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-creds "stephen:$REGISTRY_TOKEN" \
            --dest-compress-format zstd \
            docker-archive:/dev/stdin "docker://$REGISTRY/$IMAGE:$TAG"
          echo "built=true" >> "$GITHUB_OUTPUT"

  probe:
    needs: publish
    if: needs.publish.outputs.built == 'true'
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: the toolchain resolves with no network
        run: nix develop --offline -c go version && nix develop --offline -c node --version

  promote:
    needs: [publish, probe]
    # Runs after a skipped probe too (image unchanged), never after a failed one.
    if: always() && needs.publish.result == 'success' && needs.probe.result != 'failure' && needs.probe.result != 'cancelled'
    runs-on: nix
    steps:
      - name: retag as latest
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          mkdir -p /var/tmp
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --src-creds "stephen:$REGISTRY_TOKEN" --dest-creds "stephen:$REGISTRY_TOKEN" \
            "docker://$REGISTRY/$IMAGE:$TAG" "docker://$REGISTRY/$IMAGE:latest"
          echo "$REGISTRY/$IMAGE:latest -> $TAG"
