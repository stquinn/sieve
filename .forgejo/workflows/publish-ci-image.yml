# Build the sieve-ci image, push it under a unique tag, prove that tag runs a job,
# and only then move `latest` (stephen/ci-base#13).
#
# The image is a child of ci-base: `Containerfile` starts FROM ci-base `latest`, pulled
# fresh at build time, and adds one layer -- this repo's default devShell closure (go,
# node, wails, the GTK/WebKit headers) and its locked flake inputs, realised by Nix inside
# the build so the image's store knows them and `nix develop --offline` fetches nothing.
# The shared tools (agy, claude-code, tea, git) are the base's, never this repo's.
#
# It rebuilds Monday nights, after ci-base's Sunday-night self-update, so a base bump
# reaches it within a day; and on a push to main that changes the toolchain; and on
# dispatch. Never through a pull request: the probe on the pushed tag is the review.
#
# The tag is the build date and the commit, so every run publishes. Layers are pushed
# zstd-compressed; the probe is the first pull of every tag, so a runner that could not
# read the format fails there, before promote.
name: publish-ci-image
on:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, Containerfile, .forgejo/workflows/publish-ci-image.yml]
  workflow_dispatch:

env:
  REGISTRY: git.stephenquinn.ie
  IMAGE: stephen/sieve-ci
  REGISTRY_USER: stephen
  # Pull path for jobs: the in-cluster pull-through proxy of the registry. The instance
  # requires sign-in for every pull and a job's image pull carries no credentials, so it
  # goes through the proxy, which holds its own.
  MIRROR: registry-mirror.image-repository.svc.cluster.local:5002

jobs:
  publish:
    # The job's DOCKER_HOST is the runner's own dind daemon.
    runs-on: nix
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: build and push
        id: build
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          TAG="$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $REGISTRY/$IMAGE:$TAG"
          nix shell nixpkgs#docker-client -c docker build --pull -t "$IMAGE:$TAG" -f Containerfile .
          mkdir -p /var/tmp # skopeo spools the image here
          # docker save, not skopeo's docker-daemon transport: that transport reaches a remote
          # daemon only through its own flags and wants TLS files in a layout dind does not
          # write; the docker client reads the job's DOCKER_HOST and certs, as the build did.
          nix shell nixpkgs#docker-client -c docker save "$IMAGE:$TAG" \
            | nix run nixpkgs#skopeo -- --insecure-policy copy \
                --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
                --dest-compress-format zstd \
                docker-archive:/dev/stdin "docker://$REGISTRY/$IMAGE:$TAG"

  probe:
    needs: publish
    runs-on: docker
    container:
      image: registry-mirror.image-repository.svc.cluster.local:5002/stephen/sieve-ci:${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: the toolchain resolves with no network
        run: nix develop --offline -c go version && nix develop --offline -c node --version

  promote:
    needs: [publish, probe]
    runs-on: nix
    steps:
      - name: retag as latest
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          mkdir -p /var/tmp
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --src-creds "$REGISTRY_USER:$REGISTRY_TOKEN" --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
            "docker://$REGISTRY/$IMAGE:$TAG" "docker://$REGISTRY/$IMAGE:latest"
          echo "$REGISTRY/$IMAGE:latest -> $TAG"
