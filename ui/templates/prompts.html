{{define "prompts.html"}}
<div style="padding: 12px; background: var(--theme-bgDark); border-top: 1px solid var(--theme-border2); display: flex; align-items: center; gap: 16px; overflow-x: auto;" class="scrollbar-hide">
  <span style="font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--theme-muted); flex-shrink: 0;">AI Prompts</span>
  <div style="display: flex; align-items: center; gap: 8px;">
    {{range .}}
    <button 
      onclick="window.sieveOpenNote('{{.ID}}')"
      style="background: {{if .IsVirtual}}transparent{{else}}var(--theme-bgAlt){{end}}; border: 1px solid var(--theme-border2); padding: 4px 10px; border-radius: 4px; color: var(--theme-textDim); font-size: 13px; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; gap: 6px;"
      onmouseover="this.style.background='var(--theme-bgAlt)';this.style.color='var(--theme-text)'"
      onmouseout="this.style.background='{{if .IsVirtual}}transparent{{else}}var(--theme-bgAlt){{end}}';this.style.color='var(--theme-textDim)'"
      title="{{if .IsVirtual}}Baked-in Default{{else}}User Override: {{.Path}}{{end}}"
    >
      {{if .IsVirtual}}
      <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      {{else}}
      <span style="width: 6px; height: 6px; background: var(--theme-accentPrimary); border-radius: 50%; display: inline-block;"></span>
      {{end}}
      <span>{{.DisplayName}}</span>
    </button>
    {{end}}
  </div>
</div>
{{end}}
