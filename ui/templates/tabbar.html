{{define "tabbar.html"}}
<style>
.tab-item {
  display:flex;align-items:center;gap:6px;
  padding:0 12px 0 16px;height:100%;cursor:pointer;
  font-size:14px;white-space:nowrap;user-select:none;
  border:none;background:transparent;text-align:left;
  border-right:1px solid rgba(255,255,255,0.1);
  border-top:2px solid transparent;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:background 0.1s,color 0.1s;
  min-width:80px;width:250px;flex-shrink:1;
  color:var(--theme-textDim);
}
.tab-item:hover { background:var(--theme-bg);color:var(--theme-text); }
.tab-item--active {
  background:var(--theme-bg);color:var(--theme-text);
  border-top-color:var(--theme-accentPrimary);
  border-bottom-color:var(--theme-bg);
}
.tab-item__label { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0.7; }
.tab-item--active .tab-item__label { opacity:1; }
.tab-close {
  opacity:0;border:none;background:transparent;padding:0;margin-left:2px;
  cursor:pointer;color:inherit;font-size:15px;line-height:1;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity 0.1s;
}
.tab-item:hover .tab-close, .tab-item--active .tab-close { opacity:0.4; }
.tab-close:hover { opacity:1 !important; color:var(--theme-accentRed); }
.tab-bar-btn {
  padding:0 12px;background:transparent;border:none;height:100%;
  line-height:1;color:var(--theme-muted);cursor:pointer;flex-shrink:0;
  transition:color 0.1s,background 0.1s;
  border-left:1px solid rgba(255,255,255,0.1);
}
.tab-bar-btn:hover { background:var(--theme-bgAlt);color:var(--theme-text); }
</style>

<div id="tabs-area" style="display:flex;align-items:stretch;flex-shrink:1;overflow:hidden;min-width:0;">
{{range $i, $t := .Tabs}}
<button
  class="tab-item{{if eq $i $.ActiveIdx}} tab-item--active{{end}}"
  data-tab-id="{{$t.ID}}"
  data-tab-idx="{{$i}}"
  draggable="true"
  onclick="window.sieveSelectTab && window.sieveSelectTab('{{$t.ID}}')"
>
  {{if $t.UserIntent}}
  <span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;background:{{if eq $t.UserIntent "keep"}}var(--theme-accentPrimary){{else if eq $t.UserIntent "trash"}}var(--theme-accentRed){{else}}var(--theme-accentYellow){{end}};{{if ne $i $.ActiveIdx}}opacity:0.4;{{end}}"></span>
  {{else if eq $t.Status "filed"}}
  <span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;background:var(--theme-accentGreen);{{if ne $i $.ActiveIdx}}opacity:0.4;{{end}}"></span>
  {{else}}
  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
  {{end}}
  <span class="tab-item__label">{{if $t.DisplayName}}{{$t.DisplayName}}{{else}}Untitled{{end}}</span>
  {{if eq $t.Mode "markdown"}}
  <span style="font-size:12px;color:var(--theme-accentPrimary);font-weight:700;font-family:monospace;background:var(--theme-bgAlt);padding:0 6px;border-radius:4px;flex-shrink:0;">M</span>
  {{end}}
  <button class="tab-close" onclick="event.stopPropagation(); window.sieveCloseTab && window.sieveCloseTab('{{$t.ID}}')" aria-label="Close tab">×</button>
</button>
{{end}}
</div>

<div id="tab-overflow" style="display:none;position:relative;flex-shrink:0;align-items:stretch;border-left:1px solid rgba(255,255,255,0.1);">
  <button id="tab-overflow-btn" class="tab-bar-btn" style="border-left:none;font-size:14px;font-family:monospace;">▾ 0</button>
</div>

<button onclick="window.sieveNewNote && window.sieveNewNote()" aria-label="New tab" class="tab-bar-btn" style="font-size:20px;">+</button>

<div id="tab-spacer" style="flex:1;min-width:0;"></div>

<button onclick="window.sieveHelp && window.sieveHelp()" aria-label="Keyboard shortcuts (Ctrl+/)" title="Shortcuts (Ctrl+/)" class="tab-bar-btn" style="font-size:14px;">?</button>

<script>window.sieveTabBarInit && window.sieveTabBarInit()</script>
{{end}}
