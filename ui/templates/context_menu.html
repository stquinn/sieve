{{define "note-context-menu.html"}}
<div style="min-width:200px;padding:4px 0;">
  <div style="padding:6px 12px 6px;font-size:11px;font-weight:700;color:var(--theme-textDim);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--theme-border2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
    {{if .Name}}{{.Name}}{{else}}Note{{end}}
  </div>

  <button class="ctx-item" onclick="window.sieveSmartFile && window.sieveSmartFile('{{.ID}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M4.5 16.5c-1.5 1.5-1.5 3 0 3s3-1.5 3-3L19.5 4.5"/><path d="m19.5 4.5-3 3"/></svg>
    Smart File
  </button>
  <button class="ctx-item" onclick="window.sieveSmartMetadata && window.sieveSmartMetadata('{{.ID}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><circle cx="18" cy="6" r="3"/></svg>
    Smart Metadata
  </button>

  <div class="ctx-separator"></div>

  <button class="ctx-item ctx-item--keep{{if eq .Intent "keep"}} ctx-item--active{{end}}"
    hx-post="/api/sidebar/intent?id={{.ID}}&value=keep"
    hx-target="#htmx-sidebar" hx-swap="innerHTML"
    onclick="window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    Mark as Keep
  </button>
  <button class="ctx-item ctx-item--trash{{if eq .Intent "trash"}} ctx-item--active{{end}}"
    hx-post="/api/sidebar/intent?id={{.ID}}&value=trash"
    hx-target="#htmx-sidebar" hx-swap="innerHTML"
    onclick="window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    Mark as Trash
  </button>
  {{if .Intent}}
  <button class="ctx-item"
    hx-post="/api/sidebar/intent?id={{.ID}}&value="
    hx-target="#htmx-sidebar" hx-swap="innerHTML"
    onclick="window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.78"/></svg>
    Clear Intent
  </button>
  {{end}}

  <div class="ctx-separator"></div>

  <button class="ctx-item" onclick="window.sieveRenameNote && window.sieveRenameNote('{{.ID}}', '{{.Name}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Rename...
  </button>
  <button class="ctx-item" onclick="window.sieveShowInFiles && window.sieveShowInFiles('{{.ID}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    Show in Files
  </button>

  <div class="ctx-separator"></div>

  <button class="ctx-item ctx-item--danger"
    hx-post="/api/sidebar/delete-note?id={{.ID}}"
    hx-target="#htmx-sidebar" hx-swap="innerHTML"
    hx-confirm="Delete '{{.Name}}'? This cannot be undone."
    onclick="window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    Delete Note...
  </button>
</div>
{{end}}

{{define "folder-context-menu.html"}}
<div style="min-width:200px;padding:4px 0;">
  <div style="padding:6px 12px 6px;font-size:11px;font-weight:700;color:var(--theme-muted);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--theme-border2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
    {{if .Name}}{{.Name}}{{else}}Folder{{end}}
  </div>

  <button class="ctx-item" onclick="window.sieveRenameFolder && window.sieveRenameFolder('{{.ID}}', '{{.Name}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Rename...
  </button>
  <button class="ctx-item" onclick="window.sieveShowInFiles && window.sieveShowInFiles('{{.ID}}'); window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    Show in Files
  </button>

  <div class="ctx-separator"></div>

  <button class="ctx-item ctx-item--danger"
    hx-post="/api/sidebar/delete-folder?id={{.ID}}"
    hx-target="#htmx-sidebar" hx-swap="innerHTML"
    hx-confirm="Delete folder '{{.Name}}'? It must be empty."
    onclick="window.sieveCloseMenu()">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    Delete Folder
  </button>
</div>
{{end}}
