<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sieve</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="/theme.css">
    <style>
        /* Basic layout styles to replicate App.css without React wrapper */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #app-root {
            display: flex;
            flex-direction: row;
            height: 100%;
            width: 100%;
        }
        #right-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            height: 100%;
        }
        .editor-area {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
            position: relative;
        }
        .sidebar {
            flex-shrink: 0;
            height: 100%;
            background-color: var(--theme-bgDark);
            border-right: 1px solid var(--theme-border);
        }
        .sidebar-handle, .meta-handle {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
            z-index: 10;
        }
        .sidebar-handle:hover, .meta-handle:hover {
            background: var(--theme-accentPrimary);
        }
        .status-bar {
            height: 28px;
            background-color: var(--theme-bgDark);
            border-top: 1px solid var(--theme-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            font-size: 12px;
            color: var(--theme-muted);
            flex-shrink: 0;
        }
    </style>
    <style id="layout-overrides">
        #prompts-panel {
            display: {{if .ShowPrompts}}block{{else}}none{{end}};
        }
        #htmx-sidebar {
            display: {{if .ShowSidebar}}block{{else}}none{{end}};
        }
        #htmx-meta-panel {
            display: {{if .ShowMeta}}flex{{else}}none{{end}};
        }
    </style>
</head>
<body hx-ext="sse" sse-connect="/sse">
    <div id="app-root" class="theme-{{.ThemeName}} tier-{{.Tier}}" style="--sidebar-w: {{if .ShowSidebar}}{{.SidebarWidth}}{{else}}0{{end}}px; --meta-w: {{if .ShowMeta}}{{.MetaWidth}}{{else}}0{{end}}px;">
        
        {{if .ShowSidebar}}
        <div id="sidebar-wrapper" style="width: var(--sidebar-w); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; border-right: 1px solid var(--theme-border);">
            <div id="htmx-sidebar" class="sidebar" style="flex: 1; min-height: 0; border-right: none;" hx-get="/api/sidebar" hx-trigger="load"></div>
            <div id="prompts-panel" style="height: {{.PromptsHeight}}px;" hx-get="/api/prompts" hx-trigger="load"></div>
        </div>
        <div class="sidebar-handle"></div>
        {{end}}

        <div id="right-panel">
            <div id="htmx-tabbar" class="flex items-stretch bg-tn-bg-dark border-0 border-t border-b border-solid border-tn-border-2 h-[44px] shrink-0" hx-get="/api/tabs" hx-trigger="load"></div>

            <dialog id="settings-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="settings-dialog-content" style="background: var(--theme-bgDark); width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="help-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="help-dialog-content" style="background: var(--theme-bgDark); width: 90vw; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="rename-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="rename-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="delete-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="delete-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="quickswitcher-dialog" style="background: transparent; border: none; padding: 0; outline: none; margin: 15vh auto auto;">
                <div id="quickswitcher-dialog-content" style="background: var(--theme-bgDark); width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <div class="editor-area">
                <div id="htmx-editor" class="editor-wrapper" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
                    <div id="tiptap-mount" data-uuid="{{.ActiveUUID}}" data-mode="wysiwyg" style="flex: 1; min-height: 0; display: flex; flex-direction: column;"></div>
                </div>

                {{if .ShowMeta}}
                <div class="meta-handle"></div>
                <div id="htmx-meta-panel" style="width: {{.MetaWidth}}px;" class="flex flex-col flex-shrink-0 overflow-hidden bg-tn-bg-dark border-l border-tn-border text-base" hx-get="/api/meta?uuid={{.ActiveUUID}}" hx-trigger="load"></div>
                {{end}}
            </div>

            <div class="status-bar">
                <div class="status-bar__left"></div>
                <div class="status-bar__right"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/htmx.min.js"></script>
    <script src="/static/vendor/tiptap.js"></script>
    <script src="/static/extensions.js"></script>
    <script src="/static/editor.js"></script>
    <script src="/static/tabbar.js"></script>
    <script src="/static/sidebar.js"></script>

    <script>
    // Initial editor load
    window.addEventListener('DOMContentLoaded', function() {
        var mount = document.getElementById('tiptap-mount');
        if (mount) {
            var uuid = mount.getAttribute('data-uuid');
            var mode = mount.getAttribute('data-mode');
            if (uuid) {
                console.log('[index.html] Initializing editor for:', uuid);
                window.sieveInitEditor?.(mount, uuid, mode);
            }
        }
    });

    // Listen for HTMX settle to re-init editor if mount changes
    document.addEventListener('htmx:afterSettle', function(e) {
        var target = e.detail.target;
        if (target && (target.id === 'htmx-editor' || target.querySelector('#tiptap-mount'))) {
            var mount = document.getElementById('tiptap-mount');
            if (mount) {
                var uuid = mount.getAttribute('data-uuid');
                var mode = mount.getAttribute('data-mode');
                if (uuid) {
                    window.sieveInitEditor?.(mount, uuid, mode);
                }
            }
        }
    });

    // Globals for tabbar and sidebar
    window.sieveSelectTab = function(id) {
        window.htmx.ajax('POST', '/api/note/open/' + id, { target: '#htmx-tabbar', swap: 'innerHTML' });
    };

    window.sieveNewNote = function() {
        window.htmx.ajax('POST', '/api/note/new', { target: '#htmx-tabbar', swap: 'innerHTML' });
    };

    window.sieveCloseTab = function(id) {
        window.htmx.ajax('POST', '/api/tabs/close/' + id, { target: '#htmx-tabbar', swap: 'innerHTML' });
    };

    window.sieveCloseAllTabs = function() {
        window.htmx.ajax('POST', '/api/tabs/closeAll', { target: '#htmx-tabbar', swap: 'innerHTML' });
    };

    window.sieveReorderTabs = function(from, to) {
        window.htmx.ajax('POST', '/api/tabs/reorder', { target: '#htmx-tabbar', swap: 'innerHTML', values: { from: from, to: to } });
    };

    window.sieveSmartFile = function(id) {
        if (!id) {
            var mount = document.getElementById('tiptap-mount');
            if (mount) id = mount.getAttribute('data-uuid');
        }
        if (id) fetch('/api/ai/smartFile/' + id, { method: 'POST' });
    };

    window.sieveSmartMetadata = function(id) {
        if (!id) {
            var mount = document.getElementById('tiptap-mount');
            if (mount) id = mount.getAttribute('data-uuid');
        }
        if (id) fetch('/api/ai/smartMetadata/' + id, { method: 'POST' });
    };

    window.sieveKeepAndSmartFile = function(id) {
        if (!id) {
            var mount = document.getElementById('tiptap-mount');
            if (mount) id = mount.getAttribute('data-uuid');
        }
        if (id) fetch('/api/ai/keepAndFile/' + id, { method: 'POST' });
    };

    window.sieveSmartFileActive = function() {
        window.sieveSmartFile();
    };

    window.sieveKeepAndSmartFileActive = function() {
        window.sieveKeepAndSmartFile();
    };

    window.sieveRenameNote = function(id, currentName) {
        var dlg = document.getElementById('rename-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/sidebar/rename-prompt?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(currentName) + '&type=note', { target: '#rename-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveRenameFolder = function(id, currentName) {
        var dlg = document.getElementById('rename-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/sidebar/rename-prompt?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(currentName) + '&type=folder', { target: '#rename-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveOpenDelete = function(id, name, type) {
        var dlg = document.getElementById('delete-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/sidebar/delete-prompt?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name) + '&type=' + type, { target: '#delete-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveToggleSidebar = function() {
        window.htmx.ajax('POST', '/api/session/sidebar/toggle', { swap: 'none' });
    };

    window.sieveToggleMeta = function() {
        window.htmx.ajax('POST', '/api/session/meta/toggle', { swap: 'none' });
    };

    window.sieveTogglePrompts = function() {
        window.htmx.ajax('POST', '/api/session/prompts/toggle', { swap: 'none' });
    };

    window.sieveOpenQuickSwitcher = function() {
        var dlg = document.getElementById('quickswitcher-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/search-prompt', { target: '#quickswitcher-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveOpenSettings = function() {
        var dlg = document.getElementById('settings-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/settings', { target: '#settings-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveHelp = function() {
        var dlg = document.getElementById('help-dialog');
        if (dlg) {
            dlg.showModal();
            window.htmx.ajax('GET', '/api/help', { target: '#help-dialog-content', swap: 'innerHTML' });
        }
    };

    window.sieveToggleSearch = function() {
        console.log('Toggle Search not implemented yet');
    };

    window.sieveSidebarSearch = function() {
        console.log('Sidebar Search not implemented yet');
    };

    window.sieveToggleMode = function() {
        console.log('Toggle Mode not implemented yet');
    };
    </script>
</body>
</html>
