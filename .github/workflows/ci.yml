name: CI

# Basic continuous-build: run the Go + frontend test suites on every PR and on
# pushes to main, so a regression turns the pipeline red.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-go:
    name: Go Tests (CGO disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: https://github.com/nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: go vet
        run: nix develop --command env CGO_ENABLED=0 go vet ./...

      - name: go test
        run: nix develop --command env CGO_ENABLED=0 go test ./...

  build-go:
    name: Go Build (Wails / GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: https://github.com/nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: go build
        run: nix develop --command go build -tags webkit2_41 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: https://github.com/nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: nix develop --command npm ci

      - name: vitest
        working-directory: frontend
        run: nix develop --command npm test

  # Third-party credits staleness gate. third-party-licenses.json is generated
  # (tools/gencredits) and go:embed'ed; the release pipeline ships whatever is
  # committed, so this job regenerates it and fails if a dependency change
  # landed without regenerating the artifact. Deliberately NOT part of the
  # release build — releases must stay offline-reproducible and ship the
  # reviewed artifact.
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_BASE="HEAD~1"
            else
              DIFF_BASE="HEAD"
            fi
          fi

          CHANGED=$(git diff --name-only $DIFF_BASE HEAD | grep -E '^(go\.mod|go\.sum|frontend/package-lock\.json|frontend/package\.json|frontend/tiptap-bundle-entry\.js|tools/gencredits/|third-party-licenses\.json)' || true)

          if [ -n "$CHANGED" ]; then
            echo "credits=true" >> $GITHUB_OUTPUT
          else
            echo "credits=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Nix
        if: steps.filter.outputs.credits == 'true'
        uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        if: steps.filter.outputs.credits == 'true'
        uses: https://github.com/nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.filter.outputs.credits == 'true'
        working-directory: frontend
        run: nix develop --command npm ci

      - name: Regenerate credits
        if: steps.filter.outputs.credits == 'true'
        run: nix develop --command go run ./tools/gencredits

      - name: Fail if committed artifact is stale
        if: steps.filter.outputs.credits == 'true'
        run: git diff --exit-code third-party-licenses.json
