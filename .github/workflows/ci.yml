name: CI

# Basic continuous-build: run the Go + frontend test suites on every PR and on
# pushes to main, so a regression turns the pipeline red. Mirrors the env the
# release build uses (ubuntu + webkit/gtk + -tags webkit2_41).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The repo-root package (main.go/app.go) is a Wails app → CGO + WebKitGTK at
      # compile time. Same system deps the release build installs.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      # Skip T-A only (docs/TECH-DEBT.md): TestHandleBlockUpdate_notifySendsSnapshotUnderLock
      # has a flaky TempDir teardown race (a watcher still holding the buffers dir at
      # cleanup) — NOT a logic failure. Skipping it keeps CI a true regression signal;
      # remove the -skip once T-A is fixed.
      - name: go test
        run: go test -tags webkit2_41 -skip 'TestHandleBlockUpdate_notifySendsSnapshotUnderLock' ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: vitest
        working-directory: frontend
        run: npm test

  # Third-party credits staleness gate. third-party-licenses.json is generated
  # (tools/gencredits) and go:embed'ed; the release pipeline ships whatever is
  # committed, so this job regenerates it and fails if a dependency change
  # landed without regenerating the artifact. Deliberately NOT part of the
  # release build — releases must stay offline-reproducible and ship the
  # reviewed artifact.
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # gencredits disables CGO for its go-licenses subprocess, but the gtk/
      # webkit headers keep the package-load environment identical to the other
      # jobs if that ever changes.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate credits
        run: go run ./tools/gencredits

      - name: Fail if committed artifact is stale
        run: git diff --exit-code third-party-licenses.json
