name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build arm64
        run: |
          wails build -clean -platform darwin/arm64
          mv build/bin/sieve.app build/bin/sieve-arm64.app

      - name: Build amd64
        run: |
          wails build -platform darwin/amd64
          mv build/bin/sieve.app build/bin/sieve-amd64.app

      - name: Create universal binary
        run: |
          cp -R build/bin/sieve-arm64.app build/bin/sieve.app
          lipo build/bin/sieve-arm64.app/Contents/MacOS/sieve \
               build/bin/sieve-amd64.app/Contents/MacOS/sieve \
               -create -output build/bin/sieve.app/Contents/MacOS/sieve
          cd build/bin && zip -r ../../sieve-macos-universal.zip sieve.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: sieve-macos-universal.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41
          tar -czf sieve-linux-amd64.tar.gz -C build/bin sieve

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: sieve-linux-amd64.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/sieve-macos-universal.zip
            linux/sieve-linux-amd64.tar.gz
