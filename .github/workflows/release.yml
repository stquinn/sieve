name: Release (macOS)

# GitHub builds ONLY the macOS universal binary, because there is no macOS
# build agent on the Forgejo runners. Everything else — CI and the Linux
# release — lives in .forgejo/workflows/ and runs on the self-hosted Forgejo.
# The GitHub mirror receives the same v* tag and this workflow attaches the
# macOS zip to a GitHub release for that tag.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build arm64
        run: |
          wails build -clean -platform darwin/arm64 -ldflags "-X main.version=${{ github.ref_name }}"
          mv build/bin/sieve.app build/bin/sieve-arm64.app

      - name: Build amd64
        run: |
          wails build -platform darwin/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
          mv build/bin/sieve.app build/bin/sieve-amd64.app

      - name: Create universal binary
        run: |
          cp -R build/bin/sieve-arm64.app build/bin/sieve.app
          lipo build/bin/sieve-arm64.app/Contents/MacOS/sieve \
               build/bin/sieve-amd64.app/Contents/MacOS/sieve \
               -create -output build/bin/sieve.app/Contents/MacOS/sieve
          cd build/bin && zip -r ../../sieve-macos-universal.zip sieve.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: sieve-macos-universal.zip

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: macos/sieve-macos-universal.zip
