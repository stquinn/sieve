components:
  messages:
    documentBlockOp:
      name: block-op
      title: block-op
      summary: BlockOpFrame applies one granular operation to the authoritative block tree.
      description: |-
        BlockOpFrame applies one granular operation to the authoritative block tree.
        The op describes the MUTATION; OpID describes the REQUEST, which is why it
        rides the outer envelope rather than the op.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolBlockOpFrame'
    documentDetectExtractions:
      name: detect-extractions
      title: detect-extractions
      summary: DetectExtractionsFrame asks which blocks a selection could become — the offer list behind the extract menu.
      description: |-
        DetectExtractionsFrame asks which blocks a selection could become — the offer
        list behind the extract menu. It creates nothing.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolDetectExtractionsFrame'
    documentDocUpdate:
      name: doc-update
      title: doc-update
      summary: DocUpdateFrame carries the markdown-mode buffer's current text to the shadow document.
      description: |-
        DocUpdateFrame carries the markdown-mode buffer's current text to the shadow
        document. It is fire-and-forget — the shadow debounces persistence — so it
        carries no opId and gets no reply.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolDocUpdateFrame'
    documentEnterMarkdown:
      name: enter-markdown
      title: enter-markdown
      summary: 'EnterMarkdownFrame switches the document to markdown mode: the server embeds the current block state into markdown and answers with a MarkdownContentFrame carrying the merged text to seed the markdown editor.'
      description: |-
        EnterMarkdownFrame switches the document to markdown mode: the server embeds
        the current block state into markdown and answers with a MarkdownContentFrame
        carrying the merged text to seed the markdown editor.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolEnterMarkdownFrame'
    documentEnterWysiwyg:
      name: enter-wysiwyg
      title: enter-wysiwyg
      summary: EnterWysiwygFrame switches the document to WYSIWYG mode, re-parsing the block tree from the markdown the client holds and answering with a WysiwygContentFrame.
      description: |-
        EnterWysiwygFrame switches the document to WYSIWYG mode, re-parsing the block
        tree from the markdown the client holds and answering with a
        WysiwygContentFrame.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolEnterWysiwygFrame'
    documentExport:
      name: export
      title: export
      summary: ExportFrame asks for clean whole-document text — the "Copy as Markdown" contract, with AI blocks excluded because prior Q&A is conversation, not document content.
      description: |-
        ExportFrame asks for clean whole-document text — the "Copy as Markdown"
        contract, with AI blocks excluded because prior Q&A is conversation, not
        document content. It is a clipboard read, never a download.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolExportFrame'
    documentExtract:
      name: extract
      title: extract
      summary: ExtractFrame creates a block from selected content — the additive extract/paste mechanic and the in-place transform, told apart by Operation.
      description: |-
        ExtractFrame creates a block from selected content — the additive extract/paste
        mechanic and the in-place transform, told apart by Operation.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolExtractFrame'
    documentFlush:
      name: flush
      title: flush
      summary: FlushFrame asks the shadow document to persist now rather than on its debounce.
      description: |-
        FlushFrame asks the shadow document to persist now rather than on its
        debounce. It is fire-and-forget and deliberately unanswered: a save is a FACT
        about a container, not the outcome of one client's request, so it is published
        to the whole workspace as a container-saved broadcast rather than replied to
        here. A failed save answers nothing — the document stays dirty, which is the
        honest signal — and the server logs why.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolFlushFrame'
    documentFocus:
      name: focus
      title: focus
      summary: 'FocusFrame is the dwell ping: the user is looking at this document, which raises its focus count.'
      description: |-
        FocusFrame is the dwell ping: the user is looking at this document, which
        raises its focus count. It is fire-and-forget and deliberately unanswered — the
        old endpoint's response was never read, and a reply nobody consumes is a
        contract nobody maintains.

        It is NOT the liveness ping: a backgrounded tab proving it is alive is not a
        human dwelling on a document.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolFocusFrame'
    documentLoad:
      name: load
      title: load
      summary: LoadFrame asks for the document this channel is bound to, as the editor mounts it.
      description: |-
        LoadFrame asks for the document this channel is bound to, as the editor mounts
        it.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolLoadFrame'
    documentPaste:
      name: paste
      title: paste
      summary: PasteFrame hands a clipboard to the server to make sense of.
      description: |-
        PasteFrame hands a clipboard to the server to make sense of. Which of Entries
        and Slice is meaningful follows Kind — reading them the other way round is how
        a discriminated union rots into a bag of optional flags.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolPasteFrame'
    documentPing:
      name: ping
      title: ping
      summary: PingFrame is a liveness probe, answered with a PongFrame.
      description: |-
        PingFrame is a liveness probe, answered with a PongFrame. Both channels carry
        it. On the document channel it is deliberately NOT a mutating frame: a
        backgrounded tab proving it is alive is not evidence a human is editing there,
        so it must never steal listener ownership from the tab that is.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolPingFrame'
    documentRetryBlockJob:
      name: retry-block-job
      title: retry-block-job
      summary: RetryBlockJobFrame re-runs the job of one block that failed or was interrupted.
      description: RetryBlockJobFrame re-runs the job of one block that failed or was interrupted.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolRetryBlockJobFrame'
    documentBlockAttrsUpdated:
      name: block-attrs-updated
      title: block-attrs-updated
      summary: BlockAttrsUpdatedFrame is the render-back for a block whose attrs the server changed — a finished job's result, a status transition.
      description: |-
        BlockAttrsUpdatedFrame is the render-back for a block whose attrs the server
        changed — a finished job's result, a status transition.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolBlockAttrsUpdatedFrame'
    documentBlockOpAck:
      name: block-op-ack
      title: block-op-ack
      summary: AckFrame is the request-correlated outcome of a block-op or an extract.
      description: |-
        AckFrame is the request-correlated outcome of a block-op or an extract. It is
        the opId CARRIER: it is emitted after the operation, and therefore after any
        render-back the operation fired synchronously on the same socket — the
        ordering the client's correlation relies on. A failure sends both this (with
        ok:false) and the generic ErrorFrame; they answer different questions.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolAckFrame'
    documentDetectExtractionsResult:
      name: detect-extractions-result
      title: detect-extractions-result
      summary: DetectExtractionsResultFrame is one offer per kind that would accept the selection.
      description: |-
        DetectExtractionsResultFrame is one offer per kind that would accept the
        selection.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolDetectExtractionsResultFrame'
    documentError:
      name: error
      title: error
      summary: ErrorFrame reports that an operation failed, in words meant for the user.
      description: |-
        ErrorFrame reports that an operation failed, in words meant for the user. It is
        uncorrelated: an ack answers "did my request succeed", this says "something went
        wrong here". An unknown inbound frame type is answered with one.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolErrorFrame'
    documentExportContent:
      name: export-content
      title: export-content
      summary: ExportContentFrame carries the exported document.
      description: ExportContentFrame carries the exported document.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolExportContentFrame'
    documentExtractAck:
      name: extract-ack
      title: extract-ack
      summary: AckFrame is the request-correlated outcome of a block-op or an extract.
      description: |-
        AckFrame is the request-correlated outcome of a block-op or an extract. It is
        the opId CARRIER: it is emitted after the operation, and therefore after any
        render-back the operation fired synchronously on the same socket — the
        ordering the client's correlation relies on. A failure sends both this (with
        ok:false) and the generic ErrorFrame; they answer different questions.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolAckFrame'
    documentInsertBlock:
      name: insert-block
      title: insert-block
      summary: 'InsertBlockFrame is the render-back for a block the SERVER created: the client places this authoritative node at this index as a tracked transaction, and never computes a position of its own.'
      description: |-
        InsertBlockFrame is the render-back for a block the SERVER created: the client
        places this authoritative node at this index as a tracked transaction, and
        never computes a position of its own.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolInsertBlockFrame'
    documentLoadContent:
      name: load-content
      title: load-content
      summary: LoadContentFrame answers a load.
      description: |-
        LoadContentFrame answers a load. The content is EMBEDDED so its fields sit at
        the top level of the frame, the same shape the editor already mounts from.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolLoadContentFrame'
    documentMarkdownContent:
      name: markdown-content
      title: markdown-content
      summary: MarkdownContentFrame is the merged markdown that seeds the markdown editor after a mode switch.
      description: |-
        MarkdownContentFrame is the merged markdown that seeds the markdown editor
        after a mode switch.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolMarkdownContentFrame'
    documentOrderChanged:
      name: order-changed
      title: order-changed
      summary: OrderChangedFrame is the render-back for a reorder.
      description: |-
        OrderChangedFrame is the render-back for a reorder. It carries the COMPLETE
        child order for the same reason the set-order op does: applying a whole order
        is idempotent, so a duplicate or out-of-sequence frame lands the client in the
        same place, while a delta would not.

        It names no block that arrived or left — those have their own frames — so a
        client folds it as a permutation of what it already holds.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolOrderChangedFrame'
    documentPasteAck:
      name: paste-ack
      title: paste-ack
      summary: PasteAckFrame answers a paste with what the server made of the clipboard.
      description: |-
        PasteAckFrame answers a paste with what the server made of the clipboard. Its
        body is block.PasteResult — the discriminated union the client switches on —
        whichever kind was pasted, because "what happened to this clipboard" has one
        answer shape.

        Any block it created arrives separately as an insert-block render-back, which
        stays the authoritative render signal; the ack exists so the client knows
        whether to consume the caret (outcome block), insert a fragment (content), or
        replay the clipboard locally (none). A slice paste creates several blocks and
        therefore names none of them: its answer is the outcome alone.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolPasteAckFrame'
    documentPong:
      name: pong
      title: pong
      summary: PongFrame answers a PingFrame.
      description: PongFrame answers a PingFrame.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolPongFrame'
    documentRemoveBlock:
      name: remove-block
      title: remove-block
      summary: 'RemoveBlockFrame is the render-back for a block that left the container: the client retires it by id rather than reloading the document.'
      description: |-
        RemoveBlockFrame is the render-back for a block that left the container: the
        client retires it by id rather than reloading the document.

        A transform is NOT a removal — it mints a fresh identity for the same slot and
        says so with a replace-block, which carries both ids. This frame means the
        container has one child fewer.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolRemoveBlockFrame'
    documentReplaceBlock:
      name: replace-block
      title: replace-block
      summary: 'ReplaceBlockFrame is the render-back for an in-place transform: one block becomes another kind with a new identity, and the client replaces by id rather than reloading the document.'
      description: |-
        ReplaceBlockFrame is the render-back for an in-place transform: one block
        becomes another kind with a new identity, and the client replaces by id rather
        than reloading the document.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolReplaceBlockFrame'
    documentWysiwygContent:
      name: wysiwyg-content
      title: wysiwyg-content
      summary: WysiwygContentFrame is the re-parsed block list the WYSIWYG editor mounts after a mode switch.
      description: |-
        WysiwygContentFrame is the re-parsed block list the WYSIWYG editor mounts after
        a mode switch. Without it the editor would mount empty until the next document
        load.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/opId'
      payload:
        $ref: '#/components/schemas/ProtocolWysiwygContentFrame'
    workspaceCommand:
      name: command
      title: command
      summary: CommandFrame dispatches one slash command.
      description: CommandFrame dispatches one slash command.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolCommandFrame'
    workspaceCommandCancel:
      name: command-cancel
      title: command-cancel
      summary: CommandCancelFrame cancels an in-flight command by its correlation id.
      description: CommandCancelFrame cancels an in-flight command by its correlation id.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolCommandCancelFrame'
    workspaceMentionQuery:
      name: mention-query
      title: mention-query
      summary: MentionQueryFrame is the `@`-picker's typeahead question.
      description: |-
        MentionQueryFrame is the `@`-picker's typeahead question.

        It is a SIBLING FRAME TYPE, not a command: a typeahead needs a sub-100ms answer
        with no job, no worker pool and no result block, none of which a command's
        PENDING/COMPLETE lifecycle can give it.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolMentionQueryFrame'
    workspaceMentionResolve:
      name: mention-resolve
      title: mention-resolve
      summary: MentionResolveFrame asks where a coordinate opens.
      description: |-
        MentionResolveFrame asks where a coordinate opens.

        It exists so the frontend holds coordinates as OPAQUE STRINGS. Decoding an
        address in JavaScript is a second implementation of a grammar Go owns, and its
        failure mode is silence: an unrecognised form falls through the guard and the
        click does nothing.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolMentionResolveFrame'
    workspacePing:
      name: ping
      title: ping
      summary: PingFrame is a liveness probe, answered with a PongFrame.
      description: |-
        PingFrame is a liveness probe, answered with a PongFrame. Both channels carry
        it. On the document channel it is deliberately NOT a mutating frame: a
        backgrounded tab proving it is alive is not evidence a human is editing there,
        so it must never steal listener ownership from the tab that is.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolPingFrame'
    workspaceSessionScroll:
      name: session-scroll
      title: session-scroll
      summary: SessionScrollFrame persists one tab's scroll offset — the per-user VIEW coordinate a surface debounces up while the user scrolls, plus the pull at tab deactivation.
      description: |-
        SessionScrollFrame persists one tab's scroll offset — the per-user VIEW
        coordinate a surface debounces up while the user scrolls, plus the pull at tab
        deactivation.

        It is fire-and-forget and unanswered: this is caret-class state, not a shared
        UI change, so there is nothing to broadcast and nothing to swap. It names its
        tab because the workspace channel is not bound to a document — and a tab closed
        mid-flight is a harmless no-op.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolSessionScrollFrame'
    workspaceCommandResult:
      name: command-result
      title: command-result
      summary: CommandResultFrame reports one step of a command's lifecycle.
      description: |-
        CommandResultFrame reports one step of a command's lifecycle. A command emits
        several: PENDING when the work is accepted, then COMPLETE or ERROR.

        It is correlated and therefore ack-shaped, so it goes back on the socket the
        request arrived on — never to whichever socket currently owns the workspace
        channel, which is how a second tab silently swallowed another tab's answers.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolCommandResultFrame'
    workspaceContainerDeleted:
      name: container-deleted
      title: container-deleted
      summary: 'ContainerDeletedFrame is NEWS, not an instruction: the container it names is already gone from the store, and every workspace socket hears so.'
      description: |-
        ContainerDeletedFrame is NEWS, not an instruction: the container it names is
        already gone from the store, and every workspace socket hears so. A client
        RECONCILES against it — drops whatever it still holds for that uuid (its tab
        bookkeeping, its editor, that editor's document socket) — rather than being
        asked to perform a deletion of its own.

        CONTAINER, not "document", because that is the word the coordinate system
        uses: a block-holding document is addressed as container:{uuid}, and further
        container kinds are coming. Nothing here reads the container's kind — the
        reconciliation is one uuid the client no longer has anything to hold — so
        naming the frame after today's only kind would have to be renamed by the next.

        The past tense is the whole design. There is no permission to negotiate and no
        ordering to agree: a client that never held the container does nothing, and
        one that hears the same news twice does nothing the second time. That is also
        why it carries a uuid rather than a topic — nothing is refetched, because what
        went stale is the client's own state, not a view.

        The delete's own HTTP response is not a competing signal. A note deletion
        emits this frame BEFORE it renders, so on loopback the client normally
        reconciles first and tears down the editor that is still MOUNTED — the
        ordinary path, not a hazard: the teardown is the same unmount and
        channel-close the editor performs when a tab is switched away from, and the
        response's out-of-band editor swap then mounts the new active tab from
        scratch.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolContainerDeletedFrame'
    workspaceContainerSaved:
      name: container-saved
      title: container-saved
      summary: 'ContainerSavedFrame is NEWS in the same past tense its deleted sibling carries: the container it names has just reached disk, and every workspace socket hears so.'
      description: |-
        ContainerSavedFrame is NEWS in the same past tense its deleted sibling
        carries: the container it names has just reached disk, and every workspace
        socket hears so. A client that holds an editor for that uuid clears its dirty
        state; one that does not, does nothing.

        It is the ONE saved-signal, and it is here rather than on the document
        channel because a save is a FACT ABOUT A CONTAINER, not the outcome of one
        client's request. Every writer therefore publishes the same frame — the
        explicit flush, the debounce autosave, a finished job's write, and the prompt
        pseudo-document's HTTP save, which by riding this wire gains a saved-signal
        for the first time. That is also why it names its uuid: the workspace channel
        is bound to the window, not to a document.

        Version is what makes the fact ORDERABLE, which a client that waited for its
        own save to land needs: the store stamps a strictly increasing version on
        every write, so a listener can tell a save newer than the state it knew from
        a debounce write that was already in flight when it asked. A container with no
        version history reports 0 — the prompt pseudo-document is a plain file with no
        metadata — and a real document's first save is version 1, so 0 is unambiguous.

        A FAILED save emits nothing. There is no "save failed" frame to pair with
        this one, because the absence IS the signal: the document stays dirty, which
        is exactly what the user needs to see, and the server logs the reason.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolContainerSavedFrame'
    workspaceInvalidate:
      name: invalidate
      title: invalidate
      summary: InvalidateFrame tells every connected workspace socket that a subject changed and the views showing it are stale.
      description: |-
        InvalidateFrame tells every connected workspace socket that a subject changed
        and the views showing it are stale. It is a NUDGE, not a payload: the client
        refetches the affected view over HTTP, so hypermedia stays hypermedia and only
        the signalling moved onto this wire.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolInvalidateFrame'
    workspaceJobsChanged:
      name: jobs-changed
      title: jobs-changed
      summary: JobsChangedFrame broadcasts the whole job snapshot whenever it changes.
      description: |-
        JobsChangedFrame broadcasts the whole job snapshot whenever it changes. Unlike
        an invalidate it carries data: the consumers are JS reading counts and labels,
        not a view that could refetch itself, and the jobs it describes were dispatched
        on this very wire.

        It is also the ONLY way the snapshot reaches a client — there is no endpoint to
        poll — so a workspace socket is sent one the moment it connects.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolJobsChangedFrame'
    workspaceMentionResolved:
      name: mention-resolved
      title: mention-resolved
      summary: MentionResolvedFrame answers "where does this coordinate open" with something the client can ACT on — a document to open, a block to reveal — and never anything it would have to parse.
      description: |-
        MentionResolvedFrame answers "where does this coordinate open" with something
        the client can ACT on — a document to open, a block to reveal — and never
        anything it would have to parse.

        An unresolvable address is an ANSWER (found:false plus a reason), not a dropped
        frame: a request with no reply is the same silence in a slower costume. Every
        key is present in every reply, resolvable or not, so a consumer reading uuid
        never has to tell "absent" from "empty".
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolMentionResolvedFrame'
    workspaceMentionResult:
      name: mention-result
      title: mention-result
      summary: MentionResultFrame answers a typeahead.
      description: MentionResultFrame answers a typeahead.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/correlationId'
      payload:
        $ref: '#/components/schemas/ProtocolMentionResultFrame'
    workspacePong:
      name: pong
      title: pong
      summary: PongFrame answers a PingFrame.
      description: PongFrame answers a PingFrame.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProtocolPongFrame'
  schemas:
    BlockAction:
      type: string
      description: |-
        Action is an operation a processor can perform on a set of ContentEntry views.
        Recognition (IsSupportedContent) enumerates the actions an entry set supports,
        context-blind; each endpoint filters for the action it cares about (smart-paste →
        ActionPaste; extract menu → ActionExtract/ActionTransform).
    BlockBlockOp:
      type: object
      description: |-
        BlockOp is a granular mutation of the BlockDoc tree, carried over the wire
        (Stage C, spec §4). One op == one user-visible block change.
      properties:
        type:
          type: string
        blockId:
          type: string
        kind:
          type: string
        attrs:
          type: object
        aliases:
          type: array
          items:
            type: string
        index:
          type: integer
        parentId:
          type: string
        order:
          type: array
          description: 'set-order only: the complete top-level block id order to install'
          items:
            type: string
      required:
        - type
        - blockId
        - index
    BlockContentEntry:
      type: object
      description: ContentEntry is one item from the browser clipboard DataTransfer.
      properties:
        mimeType:
          type: string
        content:
          type: string
        context:
          type: object
      required:
        - mimeType
        - content
    BlockFrontendBlock:
      type: object
      description: |-
        FrontendBlock is the wire shape the WYSIWYG editor renders from (Stage D.2).
        It is a flattened, presentation-oriented projection of a SieveBlock with ONE
        uniform shape per kind: the payload always rides in Attrs (prose's body at
        Attrs["content"], structured props by key). The frontend renders prose to native
        nodes from Attrs["content"] and structured blocks through their renderer straight
        from Attrs — no markdown and no ProseMirror JSON cross the wire.
      properties:
        id:
          type: string
        kind:
          type: string
        attrs:
          type: object
        aliases:
          type: array
          items:
            type: string
      required:
        - id
        - kind
    BlockPasteOutcome:
      type: string
      description: |-
        PasteOutcome discriminates what a paste round-trip actually did. It is the tag of
        PasteResult: nothing else in the payload is meaningful without it, and the caller
        switches on it rather than inspecting which fields happen to be populated.
    BlockSupportedActions:
      type: object
      description: |-
        SupportedActions is one processor's offer for a set of entries: its Kind plus the
        operations it supports. Empty Actions == "this kind cannot be built from these
        entries" (the old IsBlock==false). The registry composes a []SupportedActions.
      properties:
        kind:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BlockAction'
      required:
        - kind
        - actions
    DomainAttachment:
      type: object
      description: |-
        Attachment is a live edge to another NodeDescriptor in the system: the address of
        something Sieve already holds, offered as context for one AI turn.

        URI AND TITLE ARE THE WHOLE OF IT, and between them they are enough for
        everything an attachment does: the title labels the chip and names the document
        in the prompt, and the uri carries the uuid a model needs to read it. NOTHING
        is fetched to use an attachment — the prompt path resolves no addresses at all,
        which is what keeps it free of the document store.

        The title is the one it was attached under. A document renamed since then shows
        its old name paired with a uuid that still resolves — for a historical turn the
        more faithful record, not a stale one — and a document DELETED since then still
        reads "Auth Design" rather than a bare address.

        IT LIVES IN domain BECAUSE IT HAS SEVERAL CARRIERS. An attachment is persisted
        as a block attr (block/ names the key) AND it rides the command envelope onto
        command.Context — and `command` and `ai` cannot import `block` (block → ai →
        command already exists, so the reverse edge would close a cycle). It is a leaf
        value like NodeDescriptor and Candidate, so the leaf is where it belongs; no carrier owns
        it.
      properties:
        uri:
          type: string
        title:
          type: string
      required:
        - uri
    DomainCandidate:
      type: object
      description: |-
        Candidate is one offer from a source's enumeration face: what the picker shows
        and what an accepted mention persists. The invariant behind it is that a
        source may only offer what it can also dereference.
      properties:
        uri:
          type: string
        title:
          type: string
        kind:
          type: string
        detail:
          type: string
      required:
        - uri
        - title
        - kind
        - detail
    DomainJobInfo:
      type: object
      description: |-
        JobInfo describes one background job the UI can see: what the tab spinner and
        the jobs view render, and what the workspace wire's jobs-changed frame carries.

        It lives in the leaf because its producer and its consumers must not have to
        know each other: services.JobTracker mints one and the protocol contract puts
        it on the wire, and domain/ is the package both can name (same reason as NodeDescriptor
        and Candidate).
      properties:
        jobId:
          type: string
        label:
          type: string
        docId:
          type: string
        spinTab:
          type: boolean
        state:
          type: string
        category:
          type: string
      required:
        - jobId
        - label
        - spinTab
    ProtocolAckFrame:
      type: object
      description: |-
        AckFrame is the request-correlated outcome of a block-op or an extract. It is
        the opId CARRIER: it is emitted after the operation, and therefore after any
        render-back the operation fired synchronously on the same socket — the
        ordering the client's correlation relies on. A failure sends both this (with
        ok:false) and the generic ErrorFrame; they answer different questions.
      properties:
        type:
          type: string
        opId:
          type: string
        ok:
          type: boolean
        error:
          type: string
          description: present only when ok is false
      required:
        - type
        - opId
        - ok
    ProtocolBlockAttrsUpdatedFrame:
      type: object
      description: |-
        BlockAttrsUpdatedFrame is the render-back for a block whose attrs the server
        changed — a finished job's result, a status transition.
      properties:
        type:
          type: string
        id:
          type: string
        attrs:
          type: object
          description: the full attrs bag, not a patch
      required:
        - type
        - id
        - attrs
    ProtocolBlockOpFrame:
      type: object
      description: |-
        BlockOpFrame applies one granular operation to the authoritative block tree.
        The op describes the MUTATION; OpID describes the REQUEST, which is why it
        rides the outer envelope rather than the op.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the block-op-ack; absent means no ack is sent
        op:
          $ref: '#/components/schemas/BlockBlockOp'
      required:
        - type
        - op
    ProtocolCommandArgs:
      type: object
      description: |-
        CommandArgs is what the user typed after the verb. It is an object rather than
        a bare string so a command can grow named arguments without a wire break.
      properties:
        text:
          type: string
      required:
        - text
    ProtocolCommandCancelFrame:
      type: object
      description: CommandCancelFrame cancels an in-flight command by its correlation id.
      properties:
        type:
          type: string
        correlationId:
          type: string
      required:
        - type
        - correlationId
    ProtocolCommandFrame:
      type: object
      description: CommandFrame dispatches one slash command.
      properties:
        type:
          type: string
        family:
          type: string
          description: the family the caller believes this command belongs to; empty skips the check
        cmd:
          type: string
          description: the verb, without its slash
        args:
          $ref: '#/components/schemas/ProtocolCommandArgs'
        correlationId:
          type: string
          description: required — a command with no correlation id is dropped, because its result could not be routed
        context:
          description: whatever the invoking surface knows about the selection, shaped by that surface
        attachments:
          type: array
          description: coordinates the composer attached with @; what a command does with them is its own business
          items:
            $ref: '#/components/schemas/DomainAttachment'
      required:
        - type
        - cmd
        - args
        - correlationId
    ProtocolCommandResultBlock:
      type: object
      description: |-
        CommandResultBlock is the block a command produced, projected to what the
        client renders it from. It is deliberately narrower than the block itself: a
        result is a rendering instruction, not a document mutation, so nothing beyond
        kind and attrs crosses.
      properties:
        kind:
          type: string
        attrs:
          type: object
      required:
        - kind
        - attrs
    ProtocolCommandResultFrame:
      type: object
      description: |-
        CommandResultFrame reports one step of a command's lifecycle. A command emits
        several: PENDING when the work is accepted, then COMPLETE or ERROR.

        It is correlated and therefore ack-shaped, so it goes back on the socket the
        request arrived on — never to whichever socket currently owns the workspace
        channel, which is how a second tab silently swallowed another tab's answers.
      properties:
        type:
          type: string
        correlationId:
          type: string
        cmd:
          type: string
        status:
          type: string
          description: PENDING | COMPLETE | ERROR
        block:
          $ref: '#/components/schemas/ProtocolCommandResultBlock'
        error:
          type: string
          description: present on ERROR
      required:
        - type
        - correlationId
        - cmd
        - status
    ProtocolContainerDeletedFrame:
      type: object
      description: |-
        ContainerDeletedFrame is NEWS, not an instruction: the container it names is
        already gone from the store, and every workspace socket hears so. A client
        RECONCILES against it — drops whatever it still holds for that uuid (its tab
        bookkeeping, its editor, that editor's document socket) — rather than being
        asked to perform a deletion of its own.

        CONTAINER, not "document", because that is the word the coordinate system
        uses: a block-holding document is addressed as container:{uuid}, and further
        container kinds are coming. Nothing here reads the container's kind — the
        reconciliation is one uuid the client no longer has anything to hold — so
        naming the frame after today's only kind would have to be renamed by the next.

        The past tense is the whole design. There is no permission to negotiate and no
        ordering to agree: a client that never held the container does nothing, and
        one that hears the same news twice does nothing the second time. That is also
        why it carries a uuid rather than a topic — nothing is refetched, because what
        went stale is the client's own state, not a view.

        The delete's own HTTP response is not a competing signal. A note deletion
        emits this frame BEFORE it renders, so on loopback the client normally
        reconciles first and tears down the editor that is still MOUNTED — the
        ordinary path, not a hazard: the teardown is the same unmount and
        channel-close the editor performs when a tab is switched away from, and the
        response's out-of-band editor swap then mounts the new active tab from
        scratch.
      properties:
        type:
          type: string
        uuid:
          type: string
          description: the container that no longer exists
      required:
        - type
        - uuid
    ProtocolContainerSavedFrame:
      type: object
      description: |-
        ContainerSavedFrame is NEWS in the same past tense its deleted sibling
        carries: the container it names has just reached disk, and every workspace
        socket hears so. A client that holds an editor for that uuid clears its dirty
        state; one that does not, does nothing.

        It is the ONE saved-signal, and it is here rather than on the document
        channel because a save is a FACT ABOUT A CONTAINER, not the outcome of one
        client's request. Every writer therefore publishes the same frame — the
        explicit flush, the debounce autosave, a finished job's write, and the prompt
        pseudo-document's HTTP save, which by riding this wire gains a saved-signal
        for the first time. That is also why it names its uuid: the workspace channel
        is bound to the window, not to a document.

        Version is what makes the fact ORDERABLE, which a client that waited for its
        own save to land needs: the store stamps a strictly increasing version on
        every write, so a listener can tell a save newer than the state it knew from
        a debounce write that was already in flight when it asked. A container with no
        version history reports 0 — the prompt pseudo-document is a plain file with no
        metadata — and a real document's first save is version 1, so 0 is unambiguous.

        A FAILED save emits nothing. There is no "save failed" frame to pair with
        this one, because the absence IS the signal: the document stays dirty, which
        is exactly what the user needs to see, and the server logs the reason.
      properties:
        type:
          type: string
        uuid:
          type: string
          description: the container whose content just reached disk
        version:
          type: integer
          description: the document version this save produced; 0 when the container keeps no version history
      required:
        - type
        - uuid
        - version
    ProtocolDetectExtractionsFrame:
      type: object
      description: |-
        DetectExtractionsFrame asks which blocks a selection could become — the offer
        list behind the extract menu. It creates nothing.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the detect-extractions-result reply
        sourceKind:
          type: string
          description: the kind the selection came from; shapes which offers make sense
        entries:
          type: array
          description: the selection, one entry per clipboard-style view
          items:
            $ref: '#/components/schemas/BlockContentEntry'
      required:
        - type
        - sourceKind
        - entries
    ProtocolDetectExtractionsResultFrame:
      type: object
      description: |-
        DetectExtractionsResultFrame is one offer per kind that would accept the
        selection.
      properties:
        type:
          type: string
        opId:
          type: string
        offers:
          type: array
          description: never null — the menu renders a list, and an empty one means nothing claimed the selection
          items:
            $ref: '#/components/schemas/BlockSupportedActions'
      required:
        - type
        - opId
        - offers
    ProtocolDocUpdateFrame:
      type: object
      description: |-
        DocUpdateFrame carries the markdown-mode buffer's current text to the shadow
        document. It is fire-and-forget — the shadow debounces persistence — so it
        carries no opId and gets no reply.
      properties:
        type:
          type: string
        markdown:
          type: string
          description: the whole buffer, not a diff
      required:
        - type
        - markdown
    ProtocolEnterMarkdownFrame:
      type: object
      description: |-
        EnterMarkdownFrame switches the document to markdown mode: the server embeds
        the current block state into markdown and answers with a MarkdownContentFrame
        carrying the merged text to seed the markdown editor.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the markdown-content reply
      required:
        - type
    ProtocolEnterWysiwygFrame:
      type: object
      description: |-
        EnterWysiwygFrame switches the document to WYSIWYG mode, re-parsing the block
        tree from the markdown the client holds and answering with a
        WysiwygContentFrame.
      properties:
        type:
          type: string
        markdown:
          type: string
          description: the buffer to re-parse; absent means keep what the shadow holds
        opId:
          type: string
          description: echoed on the wysiwyg-content reply
      required:
        - type
    ProtocolErrorFrame:
      type: object
      description: |-
        ErrorFrame reports that an operation failed, in words meant for the user. It is
        uncorrelated: an ack answers "did my request succeed", this says "something went
        wrong here". An unknown inbound frame type is answered with one.
      properties:
        type:
          type: string
        message:
          type: string
      required:
        - type
        - message
    ProtocolExportContentFrame:
      type: object
      description: ExportContentFrame carries the exported document.
      properties:
        type:
          type: string
        opId:
          type: string
        format:
          type: string
          description: the format that was produced, echoed — it decides the clipboard's mime type
        content:
          type: string
          description: the whole exported document
      required:
        - type
        - opId
        - format
        - content
    ProtocolExportFrame:
      type: object
      description: |-
        ExportFrame asks for clean whole-document text — the "Copy as Markdown"
        contract, with AI blocks excluded because prior Q&A is conversation, not
        document content. It is a clipboard read, never a download.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the export-content reply
        format:
          type: string
          description: markdown, the only format there is
      required:
        - type
    ProtocolExtractFrame:
      type: object
      description: |-
        ExtractFrame creates a block from selected content — the additive extract/paste
        mechanic and the in-place transform, told apart by Operation.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the extract-ack
        blockId:
          type: string
          description: 'the source block: transformed in place, or extracted from'
        targetKind:
          type: string
          description: the block kind to create
        operation:
          $ref: '#/components/schemas/BlockAction'
        entries:
          type: array
          description: the selection, one entry per clipboard-style view
          items:
            $ref: '#/components/schemas/BlockContentEntry'
        index:
          type: integer
          description: document position for the new block; -1 appends, and is the default when the key is absent
      required:
        - type
        - blockId
        - targetKind
        - entries
        - index
    ProtocolFlushFrame:
      type: object
      description: |-
        FlushFrame asks the shadow document to persist now rather than on its
        debounce. It is fire-and-forget and deliberately unanswered: a save is a FACT
        about a container, not the outcome of one client's request, so it is published
        to the whole workspace as a container-saved broadcast rather than replied to
        here. A failed save answers nothing — the document stays dirty, which is the
        honest signal — and the server logs why.
      properties:
        type:
          type: string
      required:
        - type
    ProtocolFocusFrame:
      type: object
      description: |-
        FocusFrame is the dwell ping: the user is looking at this document, which
        raises its focus count. It is fire-and-forget and deliberately unanswered — the
        old endpoint's response was never read, and a reply nobody consumes is a
        contract nobody maintains.

        It is NOT the liveness ping: a backgrounded tab proving it is alive is not a
        human dwelling on a document.
      properties:
        type:
          type: string
      required:
        - type
    ProtocolInsertBlockFrame:
      type: object
      description: |-
        InsertBlockFrame is the render-back for a block the SERVER created: the client
        places this authoritative node at this index as a tracked transaction, and
        never computes a position of its own.
      properties:
        type:
          type: string
        kind:
          type: string
        id:
          type: string
        attrs:
          type: object
        index:
          type: integer
          description: document position to insert at
        markdown:
          type: string
          description: markdown-mode buffer only; WYSIWYG renders from attrs
      required:
        - type
        - kind
        - id
        - attrs
        - index
        - markdown
    ProtocolInvalidateFrame:
      type: object
      description: |-
        InvalidateFrame tells every connected workspace socket that a subject changed
        and the views showing it are stale. It is a NUDGE, not a payload: the client
        refetches the affected view over HTTP, so hypermedia stays hypermedia and only
        the signalling moved onto this wire.
      properties:
        type:
          type: string
        topic:
          $ref: '#/components/schemas/ProtocolTopic'
      required:
        - type
        - topic
    ProtocolJobsChangedFrame:
      type: object
      description: |-
        JobsChangedFrame broadcasts the whole job snapshot whenever it changes. Unlike
        an invalidate it carries data: the consumers are JS reading counts and labels,
        not a view that could refetch itself, and the jobs it describes were dispatched
        on this very wire.

        It is also the ONLY way the snapshot reaches a client — there is no endpoint to
        poll — so a workspace socket is sent one the moment it connects.
      properties:
        type:
          type: string
        active:
          type: array
          description: jobs a worker is running now; never null
          items:
            $ref: '#/components/schemas/DomainJobInfo'
        queued:
          type: array
          description: jobs waiting for a worker; never null
          items:
            $ref: '#/components/schemas/DomainJobInfo'
      required:
        - type
        - active
        - queued
    ProtocolLoadContentFrame:
      type: object
      description: |-
        LoadContentFrame answers a load. The content is EMBEDDED so its fields sit at
        the top level of the frame, the same shape the editor already mounts from.
      properties:
        type:
          type: string
        body:
          type: string
          description: raw markdown, frontmatter already stripped
        mode:
          type: string
          description: wysiwyg | markdown — the mode this document was last in
        uuid:
          type: string
          description: empty when nothing was found, which the client treats as an empty document
        scroll:
          type: integer
          description: the tab's saved scroll offset; 0 parks at the top
        version:
          type: integer
          description: the version of the content served here; 0 when the container keeps no version history
        blocks:
          type: array
          description: 'WYSIWYG only: the block list, already through the shadow so ids are stable'
          items:
            $ref: '#/components/schemas/BlockFrontendBlock'
        opId:
          type: string
      required:
        - type
        - body
        - mode
        - uuid
        - scroll
        - version
    ProtocolLoadFrame:
      type: object
      description: |-
        LoadFrame asks for the document this channel is bound to, as the editor mounts
        it.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the load-content reply
      required:
        - type
    ProtocolMarkdownContentFrame:
      type: object
      description: |-
        MarkdownContentFrame is the merged markdown that seeds the markdown editor
        after a mode switch.
      properties:
        type:
          type: string
        uuid:
          type: string
        markdown:
          type: string
          description: blocks embedded back into markdown — the whole document
        opId:
          type: string
      required:
        - type
        - uuid
        - markdown
    ProtocolMentionQueryFrame:
      type: object
      description: |-
        MentionQueryFrame is the `@`-picker's typeahead question.

        It is a SIBLING FRAME TYPE, not a command: a typeahead needs a sub-100ms answer
        with no job, no worker pool and no result block, none of which a command's
        PENDING/COMPLETE lifecycle can give it.
      properties:
        type:
          type: string
        q:
          type: string
          description: the partial the user has typed
        limit:
          type: integer
          description: how many candidates to return; the server floors and caps it
        correlationId:
          type: string
      required:
        - type
        - q
        - correlationId
    ProtocolMentionResolveFrame:
      type: object
      description: |-
        MentionResolveFrame asks where a coordinate opens.

        It exists so the frontend holds coordinates as OPAQUE STRINGS. Decoding an
        address in JavaScript is a second implementation of a grammar Go owns, and its
        failure mode is silence: an unrecognised form falls through the guard and the
        click does nothing.
      properties:
        type:
          type: string
        uri:
          type: string
          description: 'a domain.Address coordinate: container:{uuid}[@v{n}], block:{uuid}, block:{container}[@v{n}]/{handle}'
        correlationId:
          type: string
      required:
        - type
        - uri
        - correlationId
    ProtocolMentionResolvedFrame:
      type: object
      description: |-
        MentionResolvedFrame answers "where does this coordinate open" with something
        the client can ACT on — a document to open, a block to reveal — and never
        anything it would have to parse.

        An unresolvable address is an ANSWER (found:false plus a reason), not a dropped
        frame: a request with no reply is the same silence in a slower costume. Every
        key is present in every reply, resolvable or not, so a consumer reading uuid
        never has to tell "absent" from "empty".
      properties:
        type:
          type: string
        correlationId:
          type: string
        uri:
          type: string
          description: the coordinate that was asked about, echoed
        found:
          type: boolean
        uuid:
          type: string
          description: the container to open
        blockId:
          type: string
          description: the block to reveal inside it; empty for a whole container
        kind:
          type: string
          description: the target's own noun, e.g. note
        title:
          type: string
        error:
          type: string
          description: why it did not resolve
      required:
        - type
        - correlationId
        - uri
        - found
        - uuid
        - blockId
        - kind
        - title
    ProtocolMentionResultFrame:
      type: object
      description: MentionResultFrame answers a typeahead.
      properties:
        type:
          type: string
        correlationId:
          type: string
        candidates:
          type: array
          description: never null — the picker renders a list, and an empty one means no matches
          items:
            $ref: '#/components/schemas/DomainCandidate'
      required:
        - type
        - correlationId
        - candidates
    ProtocolOrderChangedFrame:
      type: object
      description: |-
        OrderChangedFrame is the render-back for a reorder. It carries the COMPLETE
        child order for the same reason the set-order op does: applying a whole order
        is idempotent, so a duplicate or out-of-sequence frame lands the client in the
        same place, while a delta would not.

        It names no block that arrived or left — those have their own frames — so a
        client folds it as a permutation of what it already holds.
      properties:
        type:
          type: string
        order:
          type: array
          description: the container's complete child id order, first position to last
          items:
            type: string
      required:
        - type
        - order
    ProtocolPasteAckFrame:
      type: object
      description: |-
        PasteAckFrame answers a paste with what the server made of the clipboard. Its
        body is block.PasteResult — the discriminated union the client switches on —
        whichever kind was pasted, because "what happened to this clipboard" has one
        answer shape.

        Any block it created arrives separately as an insert-block render-back, which
        stays the authoritative render signal; the ack exists so the client knows
        whether to consume the caret (outcome block), insert a fragment (content), or
        replay the clipboard locally (none). A slice paste creates several blocks and
        therefore names none of them: its answer is the outcome alone.
      properties:
        type:
          type: string
        opId:
          type: string
        outcome:
          $ref: '#/components/schemas/BlockPasteOutcome'
        kind:
          type: string
        id:
          type: string
        rawYaml:
          type: string
        html:
          type: string
        error:
          type: string
          description: why the paste failed; the outcome is then none, so the client still replays locally
      required:
        - type
        - opId
        - outcome
    ProtocolPasteFrame:
      type: object
      description: |-
        PasteFrame hands a clipboard to the server to make sense of. Which of Entries
        and Slice is meaningful follows Kind — reading them the other way round is how
        a discriminated union rots into a bag of optional flags.
      properties:
        type:
          type: string
        opId:
          type: string
          description: echoed on the paste-ack
        kind:
          $ref: '#/components/schemas/ProtocolPasteKind'
        entries:
          type: array
          description: 'smart: the clipboard''s views. native-drop: absent — the server takes the paths from the native drop bucket the OS-level catch fed (Wails OnFileDrop); the page''s own view of a drop is never consulted. native-clipboard: absent — the server reads the clipboard itself'
          items:
            $ref: '#/components/schemas/BlockContentEntry'
        slice:
          type: array
          description: 'slice only: one view set per copied block, in order'
          items:
            type: array
            items:
              $ref: '#/components/schemas/BlockContentEntry'
        index:
          type: integer
          description: document position for the first created block; -1 appends, and is the default when the key is absent
      required:
        - type
        - kind
        - index
    ProtocolPasteKind:
      type: string
      description: |-
        PasteKind discriminates what a paste is asking for. It is a REQUEST
        discriminant: it decides which of the request's payload fields is meaningful,
        and what the server does with them.
    ProtocolPingFrame:
      type: object
      description: |-
        PingFrame is a liveness probe, answered with a PongFrame. Both channels carry
        it. On the document channel it is deliberately NOT a mutating frame: a
        backgrounded tab proving it is alive is not evidence a human is editing there,
        so it must never steal listener ownership from the tab that is.
      properties:
        type:
          type: string
      required:
        - type
    ProtocolPongFrame:
      type: object
      description: PongFrame answers a PingFrame.
      properties:
        type:
          type: string
      required:
        - type
    ProtocolRemoveBlockFrame:
      type: object
      description: |-
        RemoveBlockFrame is the render-back for a block that left the container: the
        client retires it by id rather than reloading the document.

        A transform is NOT a removal — it mints a fresh identity for the same slot and
        says so with a replace-block, which carries both ids. This frame means the
        container has one child fewer.
      properties:
        type:
          type: string
        id:
          type: string
          description: the block that left the container
      required:
        - type
        - id
    ProtocolReplaceBlockFrame:
      type: object
      description: |-
        ReplaceBlockFrame is the render-back for an in-place transform: one block
        becomes another kind with a new identity, and the client replaces by id rather
        than reloading the document.
      properties:
        type:
          type: string
        oldId:
          type: string
          description: the block being replaced; the client matches on it rather than reloading
        newKind:
          type: string
        newId:
          type: string
          description: a transform mints a fresh identity — the new block is not the old one renamed
        attrs:
          type: object
          description: the new block's full attrs bag
        newYaml:
          type: string
          description: markdown-mode buffer only
      required:
        - type
        - oldId
        - newKind
        - newId
        - attrs
        - newYaml
    ProtocolRetryBlockJobFrame:
      type: object
      description: RetryBlockJobFrame re-runs the job of one block that failed or was interrupted.
      properties:
        type:
          type: string
        id:
          type: string
          description: the block whose job re-runs
      required:
        - type
        - id
    ProtocolSessionScrollFrame:
      type: object
      description: |-
        SessionScrollFrame persists one tab's scroll offset — the per-user VIEW
        coordinate a surface debounces up while the user scrolls, plus the pull at tab
        deactivation.

        It is fire-and-forget and unanswered: this is caret-class state, not a shared
        UI change, so there is nothing to broadcast and nothing to swap. It names its
        tab because the workspace channel is not bound to a document — and a tab closed
        mid-flight is a harmless no-op.
      properties:
        type:
          type: string
        id:
          type: string
          description: the tab whose offset this is
        scroll:
          type: integer
          description: the pixel offset from the top
      required:
        - type
        - id
        - scroll
    ProtocolTopic:
      type: string
      description: |-
        Topic is what an invalidate frame invalidates — the subject a view refetches
        when it hears one. Topics are DATA on a single frame type, deliberately: a new
        subject to invalidate is a new constant here, never a new frame type, so the
        vocabulary the two sides must agree on stays fixed.
      enum:
        - notes
        - session
        - prompts
        - library
        - intent
    ProtocolWysiwygContentFrame:
      type: object
      description: |-
        WysiwygContentFrame is the re-parsed block list the WYSIWYG editor mounts after
        a mode switch. Without it the editor would mount empty until the next document
        load.
      properties:
        type:
          type: string
        uuid:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockFrontendBlock'
        opId:
          type: string
      required:
        - type
        - uuid
        - blocks
  correlationIds:
    opId:
      description: The client mints an opId on a document-wire request; the server echoes it on the reply, and an unsolicited frame carries none.
      location: $message.payload#/opId
    correlationId:
      description: A workspace-wire command carries a correlationId; every result for that command echoes it, and the reply goes back to the socket that asked.
      location: $message.payload#/correlationId
