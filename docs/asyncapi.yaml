# generated by tools/protocolgen — edit the declarations in sieve/protocol, not this file
asyncapi: 3.0.0
info:
  title: Sieve WebSocket contract
  version: 1.0.0
  description: |-
    The document and workspace WebSocket wires, generated by tools/protocolgen from sieve/protocol.
    Descriptions are the godoc comments and doc: struct tags on the declarations themselves.
    Actions are written from the server's point of view: receive is client-to-server.
    Subprotocol: sieve.v1. WSSubprotocol is the subprotocol a dial on either wire negotiates, and the server selects it on every accepted upgrade. It is half of a credential, not decoration. Both wires ride the loopback listener — WebKitGTK cannot carry an upgrade over the app's custom scheme — and any local process can reach that listener, so an upgrade must prove it comes from the shell this run served. The browser WebSocket API cannot set a request header, so the proof rides the one list it can send: a client offers this word FIRST and the run's token SECOND. The server answers with this word alone, so the token appears in no response header.
