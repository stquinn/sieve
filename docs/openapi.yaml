# generated by tools/protocolgen — edit the declarations in sieve/protocol, not this file
openapi: 3.1.0
info:
  title: Sieve HTTP contract
  version: 1.0.0
  description: |-
    The typed JSON endpoints, generated by tools/protocolgen from sieve/protocol.
    Descriptions are the godoc comments and doc: struct tags on the declarations themselves.
    Routes serving hypermedia or bytes are deliberately absent: their contract is the
    template they render, and docs/API.md inventories them.
paths:
  /api/document/load:
    get:
      operationId: getApiDocumentLoad
      summary: DocumentLoadRequest reads a channel-less pseudo-document's content.
      description: |-
        DocumentLoadRequest reads a channel-less pseudo-document's content.

        It is the read half of the pair DocumentSaveRequest closes, and serves PROMPT
        PSEUDO-DOCUMENTS exclusively: a prompt never opens a document channel, so it
        has no wire to load along either. A note always has one and always loads
        through the wire's load frame — which is why this answers a prompt id only.
      parameters:
        - name: uuid
          in: query
          required: true
          description: the prompt pseudo-document id (prompt:{name}); a query parameter, not a body field
          schema:
            type: string
      responses:
        "200":
          description: a typed body, described by the entry's Response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolDocumentContent'
  /api/document/save:
    post:
      operationId: postApiDocumentSave
      summary: DocumentSaveRequest writes a document's buffer to disk.
      description: |-
        DocumentSaveRequest writes a document's buffer to disk.

        It is the write half of the channel-less pair, and serves PROMPT
        PSEUDO-DOCUMENTS exclusively: a prompt has no document channel, so it has no
        wire to flush along. A note always has one and always saves through it.
      parameters:
        - name: uuid
          in: query
          required: true
          description: the prompt pseudo-document id (prompt:{name}); a query parameter, not a body field
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: the whole buffer
                mode:
                  type: string
                  description: records which mode saved it; empty leaves the recorded mode alone
              required:
                - body
      responses:
        "200":
          description: a typed body, described by the entry's Response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolDocumentSaveResponse'
  /api/document/{uuid}/asset/{key}:
    delete:
      operationId: deleteApiDocumentUuidAssetKey
      summary: 'AssetDeleteRequest deletes one asset of a document, irreversibly: {uuid} is the document and {key} the asset''s key, path-escaped.'
      description: |-
        AssetDeleteRequest deletes one asset of a document, irreversibly: {uuid} is
        the document and {key} the asset's key, path-escaped. An asset a block of the
        document still holds is refused with 409, judged against the blocks the editor
        holds now; deleting the block that holds it is the way to free it. A deleted
        asset is announced as an invalidate of the notes topic. The request has no body.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 204, or a body no caller reads
  /api/folder:
    post:
      operationId: postApiFolder
      summary: FolderCreateRequest makes a new folder.
      description: FolderCreateRequest makes a new folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolFolderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProtocolFolderCreateRequest'
      responses:
        "200":
          description: HTML for HTMX to swap in; the template is its contract
          content:
            text/html:
              schema:
                type: string
  /api/folder/{id}:
    patch:
      operationId: patchApiFolderId
      summary: FolderPatchRequest changes a folder's properties.
      description: |-
        FolderPatchRequest changes a folder's properties. Both fields are POINTERS
        because this is a patch: absent must be distinguishable from empty-or-false, or
        renaming a folder would silently collapse it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolFolderPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProtocolFolderPatchRequest'
      responses:
        "200":
          description: HTML for HTMX to swap in; the template is its contract
          content:
            text/html:
              schema:
                type: string
  /api/ink/live/note:
    get:
      operationId: getApiInkLiveNote
      summary: InkLiveNoteRequest asks which synced Digital Note the Live view mirrors.
      description: |-
        InkLiveNoteRequest asks which synced Digital Note the Live view mirrors. The request has no
        body.
      responses:
        "200":
          description: a typed body, described by the entry's Response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolInkLiveNoteResponse'
  /api/ink/notes/{uuid}/describe:
    post:
      operationId: postApiInkNotesUuidDescribe
      summary: 'InkDescribeRequest names a synced Digital Note now: {uuid} is the note''s block container, and its name, summary, keywords and categories are described again from its pages, whether or not they are of the note as it stands.'
      description: |-
        InkDescribeRequest names a synced Digital Note now: {uuid} is the note's block container, and
        its name, summary, keywords and categories are described again from its pages, whether or not
        they are of the note as it stands. 204 is the job submitted, or one already naming the note.
        Otherwise the body is plain text a person can be shown: 404 for a container that is not a held
        Digital Note, 409 when nothing can name it now (no AI is configured, the note has no ink, or
        nothing is open that can draw its pages), 503 when ink is unavailable. The request has no body.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 204, or a body no caller reads
  /api/ink/notes/{uuid}/open-on-tablet:
    post:
      operationId: postApiInkNotesUuidOpenOnTablet
      summary: 'InkOpenOnTabletRequest asks the tablet a synced Digital Note came from to open it, leaving the page to the tablet: {uuid} is the note''s block container.'
      description: |-
        InkOpenOnTabletRequest asks the tablet a synced Digital Note came from to open it, leaving the
        page to the tablet: {uuid} is the note's block container. It waits a few seconds at most for
        the tablet. A container that is not a Digital Note from a tablet is 404, with a plain-text body,
        and ink being unavailable 503. The request has no body.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: a typed body, described by the entry's Response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolInkOpenOnTabletResponse'
  /api/ink/notes/{uuid}/pages/{page}/export:
    get:
      operationId: getApiInkNotesUuidPagesPageExport
      summary: 'InkPageExportRequest reads one page of a synced Digital Note in the export shape of docs/ink-contract.md §4.2: {uuid} is the note''s block container and {page} the page''s index among the pages present, from 0.'
      description: |-
        InkPageExportRequest reads one page of a synced Digital Note in the export shape of
        docs/ink-contract.md §4.2: {uuid} is the note's block container and {page} the page's index
        among the pages present, from 0. An unknown container, a container that is not a Digital Note
        and a page out of range are 404. The request has no body.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: a typed body, described by the entry's Response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolInkPageExport'
  /api/ink/notes/{uuid}/pages/{page}/image:
    get:
      operationId: getApiInkNotesUuidPagesPageImage
      summary: 'InkPageImageRequest reads one page of a synced Digital Note as a PNG, drawn by the app''s window when no image of the page as it stands is kept: {uuid} is the note''s block container and {page} the page''s index among the pages present, from 0.'
      description: |-
        InkPageImageRequest reads one page of a synced Digital Note as a PNG, drawn by the app's window
        when no image of the page as it stands is kept: {uuid} is the note's block container and {page}
        the page's index among the pages present, from 0. The page key the image was drawn at is the
        X-Sieve-Ink-Page-Key header. An unknown container, a container that is not a Digital Note and
        a page out of range are 404; no window connected to draw it is 503, and a window that does not
        answer in time is 504. The request has no body.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: a PNG, image/png
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/note/{id}:
    patch:
      operationId: patchApiNoteId
      summary: NotePatchRequest changes a note's properties.
      description: NotePatchRequest changes a note's properties.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolNotePatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProtocolNotePatchRequest'
      responses:
        "200":
          description: HTML for HTMX to swap in; the template is its contract
          content:
            text/html:
              schema:
                type: string
  /api/tabs/close:
    post:
      operationId: postApiTabsClose
      summary: TabsCloseRequest closes every listed tab — the ONE close mechanism.
      description: |-
        TabsCloseRequest closes every listed tab — the ONE close mechanism. A single
        close sends one id, Close All sends every id, Close Others sends the complement
        of the kept tab: the client computes the set, the server closes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolTabsCloseRequest'
      responses:
        "200":
          description: HTML for HTMX to swap in; the template is its contract
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    BlockFrontendBlock:
      type: object
      description: |-
        FrontendBlock is the wire shape the WYSIWYG editor renders from (Stage D.2).
        It is a flattened, presentation-oriented projection of a SieveBlock with ONE
        uniform shape per kind: the payload always rides in Attrs (prose's body at
        Attrs["content"], structured props by key). The frontend renders prose to native
        nodes from Attrs["content"] and structured blocks through their renderer straight
        from Attrs — no markdown and no ProseMirror JSON cross the wire.
      properties:
        id:
          type: string
        kind:
          type: string
        attrs:
          type: object
        aliases:
          type: array
          items:
            type: string
      required:
        - id
        - kind
    ProtocolAssetDeleteRequest:
      type: object
      description: |-
        AssetDeleteRequest deletes one asset of a document, irreversibly: {uuid} is
        the document and {key} the asset's key, path-escaped. An asset a block of the
        document still holds is refused with 409, judged against the blocks the editor
        holds now; deleting the block that holds it is the way to free it. A deleted
        asset is announced as an invalidate of the notes topic. The request has no body.
    ProtocolDocumentContent:
      type: object
      description: |-
        DocumentContent is a container as the editor mounts it: for a document the
        buffer, the mode it was last in, and — in WYSIWYG — the block list it renders
        from; for a block container its one block.
      properties:
        body:
          type: string
          description: raw markdown, frontmatter already stripped
        mode:
          type: string
          description: wysiwyg | markdown — the mode this document was last in
        uuid:
          type: string
          description: empty when nothing was found, which the client treats as an empty document
        kind:
          type: string
          description: 'the container''s own noun: note | buffer | prompt | a block kind; absent when nothing was found'
        name:
          type: string
          description: what the container is called; absent when it has no name
        scroll:
          type: integer
          description: the tab's saved scroll offset; 0 parks at the top
        version:
          type: integer
          description: the version of the content served here; 0 when the container keeps no version history
        presenting:
          type: boolean
          description: the tab was last left in Presentation Mode; absent when it was not
        blocks:
          type: array
          description: 'WYSIWYG only: the block list, already through the shadow so ids are stable'
          items:
            $ref: '#/components/schemas/BlockFrontendBlock'
      required:
        - body
        - mode
        - uuid
        - scroll
        - version
    ProtocolDocumentSaveResponse:
      type: object
      description: |-
        DocumentSaveResponse reports the version the save produced. Its one caller
        saves a PROMPT, which the store writes as a plain file with no metadata, so
        the answer is always 0: this endpoint has no versioned container to describe.
        The saved-signal a client acts on is the container-saved fact, not this body.
      properties:
        version:
          type: integer
          description: the saved document's new version number; 0 for a container that keeps no version history
      required:
        - version
    ProtocolFolderCreateRequest:
      type: object
      description: FolderCreateRequest makes a new folder.
      properties:
        name:
          type: string
      required:
        - name
    ProtocolFolderPatchRequest:
      type: object
      description: |-
        FolderPatchRequest changes a folder's properties. Both fields are POINTERS
        because this is a patch: absent must be distinguishable from empty-or-false, or
        renaming a folder would silently collapse it.
      properties:
        name:
          type: string
          description: the new display name; absent leaves it alone
        open:
          type: boolean
          description: whether the folder is expanded in the tree; absent leaves it alone
    ProtocolInkDescribeRequest:
      type: object
      description: |-
        InkDescribeRequest names a synced Digital Note now: {uuid} is the note's block container, and
        its name, summary, keywords and categories are described again from its pages, whether or not
        they are of the note as it stands. 204 is the job submitted, or one already naming the note.
        Otherwise the body is plain text a person can be shown: 404 for a container that is not a held
        Digital Note, 409 when nothing can name it now (no AI is configured, the note has no ink, or
        nothing is open that can draw its pages), 503 when ink is unavailable. The request has no body.
    ProtocolInkExportDevice:
      type: object
      description: InkExportDevice is the tablet the note was written on.
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
      required:
        - id
        - name
        - model
    ProtocolInkExportNote:
      type: object
      description: InkExportNote is the header of the note a page belongs to.
      properties:
        id:
          type: string
          description: the companion's note id
        created:
          type: string
          description: RFC 3339 in UTC
        title:
          type: string
        pageAspect:
          type: number
          description: page width over page height
        template:
          $ref: '#/components/schemas/ProtocolInkExportTemplate'
        device:
          $ref: '#/components/schemas/ProtocolInkExportDevice'
      required:
        - id
        - created
        - title
        - pageAspect
        - device
    ProtocolInkExportPoint:
      type: object
      description: InkExportPoint is one sampled pen point, in page units.
      properties:
        x:
          type: number
        y:
          type: number
        pressure:
          type: number
          description: 0 to 1
        tMillis:
          type: integer
          description: milliseconds from the stroke's first point
        tiltX:
          type: integer
        tiltY:
          type: integer
        size:
          type: number
          description: always 0 in an export
      required:
        - x
        - y
        - pressure
        - tMillis
        - tiltX
        - tiltY
        - size
    ProtocolInkExportStroke:
      type: object
      description: InkExportStroke is one stroke on the page.
      properties:
        id:
          type: string
        tool:
          type: string
        widthClass:
          type: integer
        startMillis:
          type: integer
          description: milliseconds since the note's created
        points:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolInkExportPoint'
      required:
        - id
        - tool
        - widthClass
        - startMillis
        - points
    ProtocolInkExportTemplate:
      type: object
      description: 'InkExportTemplate is a page template: its id and its parameters by name.'
      properties:
        id:
          type: string
        params:
          type: object
          additionalProperties:
            type: number
      required:
        - id
        - params
    ProtocolInkLiveNoteRequest:
      type: object
      description: |-
        InkLiveNoteRequest asks which synced Digital Note the Live view mirrors. The request has no
        body.
    ProtocolInkLiveNoteResponse:
      type: object
      description: InkLiveNoteResponse names the note the Live view mirrors.
      properties:
        note:
          type: string
          description: the uuid of the block container holding the mirrored note; empty when there is no Live view or no container holds its note yet
      required:
        - note
    ProtocolInkOpenOnTabletRequest:
      type: object
      description: |-
        InkOpenOnTabletRequest asks the tablet a synced Digital Note came from to open it, leaving the
        page to the tablet: {uuid} is the note's block container. It waits a few seconds at most for
        the tablet. A container that is not a Digital Note from a tablet is 404, with a plain-text body,
        and ink being unavailable 503. The request has no body.
    ProtocolInkOpenOnTabletResponse:
      type: object
      description: InkOpenOnTabletResponse is what came of an InkOpenOnTabletRequest.
      properties:
        outcome:
          type: string
          description: opened | no-tablet | other-tablet | refused | no-answer, as ink-open-on-tablet-result names them
        reason:
          type: string
          description: 'refused only: the tablet''s reason, not-foreground | not-offered | another'
        message:
          type: string
          description: what came of it, in words a person can be shown
      required:
        - outcome
        - message
    ProtocolInkPageExport:
      type: object
      description: |-
        InkPageExport is one page of a Digital Note as the ink renderer takes it: the note's header and
        the page's strokes in the order they were added.
      properties:
        note:
          $ref: '#/components/schemas/ProtocolInkExportNote'
        strokes:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolInkExportStroke'
      required:
        - note
        - strokes
    ProtocolInkPageExportRequest:
      type: object
      description: |-
        InkPageExportRequest reads one page of a synced Digital Note in the export shape of
        docs/ink-contract.md §4.2: {uuid} is the note's block container and {page} the page's index
        among the pages present, from 0. An unknown container, a container that is not a Digital Note
        and a page out of range are 404. The request has no body.
    ProtocolInkPageImageRequest:
      type: object
      description: |-
        InkPageImageRequest reads one page of a synced Digital Note as a PNG, drawn by the app's window
        when no image of the page as it stands is kept: {uuid} is the note's block container and {page}
        the page's index among the pages present, from 0. The page key the image was drawn at is the
        X-Sieve-Ink-Page-Key header. An unknown container, a container that is not a Digital Note and
        a page out of range are 404; no window connected to draw it is 503, and a window that does not
        answer in time is 504. The request has no body.
    ProtocolNotePatchRequest:
      type: object
      description: NotePatchRequest changes a note's properties.
      properties:
        name:
          type: string
          description: the new display name
      required:
        - name
    ProtocolTabsCloseRequest:
      type: object
      description: |-
        TabsCloseRequest closes every listed tab — the ONE close mechanism. A single
        close sends one id, Close All sends every id, Close Others sends the complement
        of the kept tab: the client computes the set, the server closes it.
      properties:
        ids:
          type: array
          description: the tabs to close
          items:
            type: string
      required:
        - ids
