name: CI

# Basic continuous-build: run the Go + frontend test suites on every PR and on
# pushes to main, so a regression turns the pipeline red.
#
# .gitea/workflows/ci.yml and .github/workflows/ci.yml are maintained as
# BYTE-IDENTICAL copies — Forgejo and the GitHub mirror each read their own. They
# silently diverged once during an abandoned Nix experiment; edit both and diff.
#
# Toolchain versions track the repo rather than hardcoded strings: go-version-file
# reads go.mod's `go` directive (the same source tools/gencredits pins the stdlib
# version from), and node matches the flake devShell's nodejs_22.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-go:
    name: Go Tests (CGO disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: go test
        run: CGO_ENABLED=0 go test ./...

  build-go:
    name: Go Build (Wails / GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-gtk-webkit
          restore-keys: |
            ${{ runner.os }}-apt-gtk-

      # The repo-root package (main.go/app.go) is a Wails app → CGO + WebKitGTK at
      # compile time. Same system deps the release build installs.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: go build
        run: go build -tags webkit2_41 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: vitest
        working-directory: frontend
        run: npm test

  # Third-party credits staleness gate. third-party-licenses.json is generated
  # (tools/gencredits) and go:embed'ed; the release pipeline ships whatever is
  # committed, so this job regenerates it and fails if a dependency change
  # landed without regenerating the artifact. Deliberately NOT part of the
  # release build — releases must stay offline-reproducible and ship the
  # reviewed artifact.
  credits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            DIFF_BASE="origin/${{ github.base_ref }}"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_BASE="HEAD~1"
            else
              DIFF_BASE="HEAD"
            fi
          fi

          CHANGED=$(git diff --name-only $DIFF_BASE HEAD | grep -E '^(go\.mod|go\.sum|frontend/package-lock\.json|frontend/package\.json|frontend/tiptap-bundle-entry\.js|tools/gencredits/|third-party-licenses\.json)' || true)

          if [ -n "$CHANGED" ]; then
            echo "credits=true" >> $GITHUB_OUTPUT
          else
            echo "credits=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v5
        if: steps.filter.outputs.credits == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.credits == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache apt packages
        if: steps.filter.outputs.credits == 'true'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-gtk-webkit
          restore-keys: |
            ${{ runner.os }}-apt-gtk-

      # gencredits disables CGO for its go-licenses subprocess, but the gtk/
      # webkit headers keep the package-load environment identical to the other
      # jobs if that ever changes.
      - name: Install system dependencies
        if: steps.filter.outputs.credits == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        if: steps.filter.outputs.credits == 'true'
        working-directory: frontend
        run: npm ci

      - name: Regenerate credits
        if: steps.filter.outputs.credits == 'true'
        run: go run ./tools/gencredits

      - name: Fail if committed artifact is stale
        if: steps.filter.outputs.credits == 'true'
        run: git diff --exit-code third-party-licenses.json


