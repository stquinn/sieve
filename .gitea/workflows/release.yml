name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41
          tar -czf stash-linux-amd64.tar.gz -C build/bin stash

      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}
        run: |
          TAG=${{ github.ref_name }}
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"draft\": false}" \
            "$GITEA_URL/api/v1/repos/${{ github.repository }}/releases" | jq -r '.id')
          curl -sf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@stash-linux-amd64.tar.gz" \
            "$GITEA_URL/api/v1/repos/${{ github.repository }}/releases/$RELEASE_ID/assets"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Wait briefly for the GitHub Actions release to be created from the mirrored tag
          sleep 30
          gh release upload ${{ github.ref_name }} stash-linux-amd64.tar.gz \
            --repo ${{ vars.GITHUB_REPO }} \
            --clobber
