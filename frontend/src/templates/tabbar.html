{{define "tabbar.html"}}
<div id="tabs-area" class="flex items-stretch shrink overflow-hidden min-w-0">
{{range $i, $t := .Tabs}}
<div class="flex items-stretch shrink-0 w-[250px]"
     data-tab-id="{{$t.ID}}"
     data-tab-idx="{{$i}}"
     data-ctx-id="{{$t.ID}}"
     data-ctx-name="{{if $t.DisplayName}}{{$t.DisplayName}}{{else}}Untitled{{end}}"
     data-ctx-intent="{{$t.UserIntent}}"
     data-ctx-is-dir="false"
     data-ctx-is-tab="true"
     draggable="true">
  <div
    class="group flex items-center gap-1.5 pl-3 pr-1.5 h-full cursor-pointer w-full text-[14px] select-none transition-colors border-solid border-0 border-r-[1px] border-r-white/10 -mb-[2px] border-t-2 border-b-2 overflow-hidden{{if eq $i $.ActiveIdx}} bg-tn-bg text-tn-text border-t-tn-blue border-b-tn-bg{{else}} bg-tn-bg-dark text-tn-text-dim hover:bg-tn-bg hover:text-tn-text border-t-transparent border-b-transparent{{end}}"
    onmousedown="if(event.button===0 && !event.target.closest('button')){window.sieveWorkspace.open('{{$t.ID}}')}"
  >
    <div class="flex items-center justify-center relative w-4 h-4 shrink-0">
      <div class="tab-icon-normal flex items-center justify-center">
        {{if eq $t.UserIntent "trash"}}
        <span class="w-1.5 h-1.5 rounded-full shrink-0 bg-tn-red{{if ne $i $.ActiveIdx}} opacity-40{{end}}"></span>
        {{else if eq $t.Status "filed"}}
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 opacity-40 shrink-0" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <mask id="doc-mask-{{$t.ID}}">
              <rect width="24" height="24" fill="white" />
              <line x1="16" y1="13" x2="8" y2="13" stroke="black" stroke-width="2" />
              <line x1="16" y1="17" x2="8" y2="17" stroke="black" stroke-width="2" />
              <line x1="10" y1="9" x2="8" y2="9" stroke="black" stroke-width="2" />
            </mask>
          </defs>
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" mask="url(#doc-mask-{{$t.ID}})" />
        </svg>
        {{else}}
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 opacity-40 shrink-0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        {{end}}
      </div>
      <span class="tab-spinner absolute hidden w-3.5 h-3.5 shrink-0 rounded-full border-[1.5px] border-solid border-tn-cyan border-t-transparent animate-spin"></span>
    </div>
    <span class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap min-w-0 text-left{{if ne $i $.ActiveIdx}} opacity-70{{end}}">{{if $t.DisplayName}}{{$t.DisplayName}}{{else}}Untitled{{end}}</span>
    {{if eq $t.Mode "markdown"}}
    <span class="text-[12px] text-tn-blue font-bold font-mono bg-tn-bg-alt px-1.5 rounded shrink-0">M</span>
    {{end}}
    <button
      onmousedown="event.stopPropagation(); window.sieveWorkspace.close('{{$t.ID}}')"
      aria-label="Close tab"
      class="ml-0.5 opacity-0 group-hover:opacity-40 hover:!opacity-100 hover:text-tn-red shrink-0 transition-opacity flex items-center justify-center w-4 h-4 text-[15px] leading-none"
    >×</button>
  </div>
</div>
{{end}}
</div>

<div id="tab-overflow" class="relative shrink-0 items-stretch border-0 border-l border-solid border-white/10" style="display:none">
  <button id="tab-overflow-btn" class="px-3 bg-tn-bg-alt border-none h-full text-[15px] font-mono font-bold leading-none transition-colors text-tn-text-dim hover:text-tn-text hover:bg-tn-bg">▼ 0</button>
</div>

<button
  onclick="window.sieveWorkspace.newNote()"
  aria-label="New tab"
  class="px-3 bg-transparent border-none h-full text-tn-muted hover:text-tn-text hover:bg-tn-bg-alt text-[20px] leading-none shrink-0 transition-colors border-0 border-l border-solid border-white/10"
>+</button>

<div id="tab-spacer" class="flex-1 min-w-0"></div>

{{end}}
