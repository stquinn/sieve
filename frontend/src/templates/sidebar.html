{{define "sidebar.html"}}
<div class="sidebar__section-title" style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--theme-border2);height:44px;min-height:44px;padding:0;flex-shrink:0;">
  <span style="padding-left:1rem;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;color:var(--theme-muted);">Library</span>
  <div style="display:flex;align-items:center;gap:4px;padding-right:4px;">
    <button class="sidebar__icon-btn" onclick="window.sieveSidebarSearch && window.sieveSidebarSearch()" title="Search Library (⌘⇧F)" style="background:transparent;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--theme-muted);border-radius:6px;" onmouseover="this.style.background='var(--theme-bgAlt)';this.style.color='var(--theme-text)'" onmouseout="this.style.background='transparent';this.style.color='var(--theme-muted)'">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="sidebar__icon-btn"
      hx-post="/api/note/new"
      hx-target="#htmx-tabbar"
      hx-swap="innerHTML"
      title="New Note (⌘N)" style="background:transparent;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--theme-muted);border-radius:6px;" onmouseover="this.style.background='var(--theme-bgAlt)';this.style.color='var(--theme-text)'" onmouseout="this.style.background='transparent';this.style.color='var(--theme-muted)'">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="sidebar__icon-btn"
      onclick="htmx.ajax('GET','/api/sidebar/create-folder-prompt?parentId=',{target:'#rename-dialog-content',swap:'innerHTML'}).then(function(){document.getElementById('rename-dialog').showModal()})"
      title="Create Folder" style="background:transparent;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--theme-muted);border-radius:6px;" onmouseover="this.style.background='var(--theme-bgAlt)';this.style.color='var(--theme-text)'" onmouseout="this.style.background='transparent';this.style.color='var(--theme-muted)'">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
    </button>
    <button class="sidebar__icon-btn"
      onclick="htmx.ajax('GET','/api/settings',{target:'#settings-dialog-content',swap:'innerHTML'}).then(function(){document.getElementById('settings-dialog').showModal()})"
      title="Settings (⌘,)" style="background:transparent;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--theme-muted);border-radius:6px;" onmouseover="this.style.background='var(--theme-bgAlt)';this.style.color='var(--theme-text)'" onmouseout="this.style.background='transparent';this.style.color='var(--theme-muted)'">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>
<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;">
  {{if not .}}
  <div class="sidebar__empty">No filed documents yet</div>
  {{else}}
  {{range .}}{{template "entry" .}}{{end}}
  {{end}}
</div>
{{end}}

{{define "entry"}}
{{if .IsDir}}
<div>
  <button
    class="sidebar__dir{{if gt .Depth 0}} sidebar__dir--nested{{end}} w-full text-left"
    style="display:flex;align-items:center;gap:4px;transition:background 0.1s;width:100%;text-align:left;padding-left:{{indent .Depth}};"
    hx-post="/api/sidebar?toggle={{.ID}}"
    hx-target="#htmx-sidebar"
    hx-swap="innerHTML"
    hx-push-url="false"
    data-ctx-id="{{.ID}}"
    data-ctx-type="folder"
    data-ctx-name="{{.Name}}"
    data-ctx-is-dir="true"
  >
    <span style="opacity:0.7;display:flex;align-items:center;flex-shrink:0;">
      {{if .IsOpen}}
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      {{else}}
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      {{end}}
    </span>
    {{if .IsOpen}}
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.7;color:var(--theme-accentPrimary);flex-shrink:0;"><path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
    {{else}}
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.7;color:var(--theme-accentPrimary);flex-shrink:0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    {{end}}
    <span class="sidebar__dir-name" style="font-size:15px;font-weight:700;color:var(--theme-textDim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">{{.Name}}</span>
  </button>
  {{if .IsOpen}}
  {{range .Children}}{{template "entry" .}}{{end}}
  {{end}}
</div>
{{else}}
<button
  class="sidebar__file"
  draggable="true"
  style="position:relative;width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding-left:{{fileIndent .Depth}};"
  onmousedown="window.htmx && window.htmx.ajax('POST', '/api/note/open/{{.ID}}', {target:'#htmx-tabbar',swap:'innerHTML'})"
  data-ctx-id="{{.ID}}"
  data-ctx-parent-id="{{.ParentID}}"
  data-ctx-type="note"
  data-ctx-name="{{if .DisplayName}}{{.DisplayName}}{{else}}{{.Name}}{{end}}"
  data-ctx-intent="{{.UserIntent}}"
  data-ctx-is-dir="false"
>
  <div style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;flex:1;min-width:0;">
    <div style="display:flex;align-items:center;gap:8px;width:100%;">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">
        {{if eq .Status "error"}}<span title="Malformed YAML">⚠️</span>{{end}}
        {{if .UserIntent}}
        <span style="width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;background:{{if eq .UserIntent "keep"}}var(--theme-accentPrimary){{else if eq .UserIntent "trash"}}var(--theme-accentRed){{else}}var(--theme-accentYellow){{end}};"></span>
        {{end}}
        <span style="font-size:15px;font-weight:500;color:var(--theme-textDim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">{{if .DisplayName}}{{.DisplayName}}{{else}}{{.Name}}{{end}}</span>
      </div>
    </div>
  </div>
</button>
{{end}}
{{end}}
