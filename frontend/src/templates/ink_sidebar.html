{{define "ink_sidebar.html"}}{{if .Enabled}}<div class="sidebar__section-title" style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--theme-border2);border-bottom:1px solid var(--theme-border2);height:44px;min-height:44px;padding:0;flex-shrink:0;">
  <span style="padding-left:1rem;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;color:var(--theme-muted);">Ink</span>
</div>
<div style="display:flex;flex-direction:column;min-height:0;">
  {{with .Live}}
  <button
    class="sidebar__file"
    data-ink-live="{{if .Waiting}}waiting{{else}}live{{end}}"
    style="position:relative;width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding-left:{{fileIndent 0}};{{if .Active}}background:var(--theme-bgAlt);color:var(--theme-text);box-shadow:inset 2px 0 0 var(--theme-accentPrimary);{{end}}"
    onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
    title="{{if .Waiting}}Waiting for the tablet{{else}}The tablet is writing{{end}}{{if .Note}}: {{.Note}}{{end}}"
  >
    <div style="display:flex;align-items:center;gap:8px;width:100%;min-width:0;">
      <span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;margin:0 3px;{{if .Waiting}}box-shadow:inset 0 0 0 1.5px var(--theme-muted);{{else}}background:var(--theme-accentRed);{{end}}"></span>
      <span style="font-size:15px;font-weight:{{if .Active}}600{{else}}500{{end}};color:{{if .Active}}var(--theme-text){{else}}var(--theme-textDim){{end}};white-space:nowrap;flex-shrink:0;">Live{{if .Device}} · {{.Device}}{{end}}</span>
      <span style="font-size:13px;color:var(--theme-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">{{if .Waiting}}waiting{{else}}{{.Note}}{{end}}</span>
    </div>
  </button>
  {{end}}
  {{if not .Notes}}
  <div class="sidebar__empty">No synced notes yet</div>
  {{else}}
  {{range .Notes}}
  <button
    class="sidebar__file"
    data-ink-note="{{.UUID}}"
    style="position:relative;width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding-left:{{fileIndent 0}};{{if .Active}}background:var(--theme-bgAlt);color:var(--theme-text);box-shadow:inset 2px 0 0 var(--theme-accentPrimary);{{end}}"
    onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
  >
    <div style="display:flex;align-items:center;gap:8px;width:100%;min-width:0;">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;flex-shrink:0;"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span style="font-size:15px;font-weight:{{if .Active}}600{{else}}500{{end}};color:{{if .Active}}var(--theme-text){{else}}var(--theme-textDim){{end}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;">{{.Title}}</span>
      <span style="font-size:13px;color:var(--theme-muted);white-space:nowrap;flex-shrink:0;padding-right:0.25rem;">{{.Pages}} {{if eq .Pages 1}}page{{else}}pages{{end}}</span>
    </div>
  </button>
  {{end}}
  {{end}}
</div>{{end}}{{end}}
