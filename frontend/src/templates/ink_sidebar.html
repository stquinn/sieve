{{define "ink_note_icon"}}<svg class="ink-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>{{end}}
{{define "ink_live_icon"}}<svg class="ink-icon ink-icon--live" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.24 7.76a6 6 0 0 1 0 8.48"/><path d="M7.76 16.24a6 6 0 0 1 0-8.48"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>{{end}}
{{define "ink_sidebar.html"}}{{if .Enabled}}<div class="sidebar__section-title" style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--theme-border2);border-bottom:1px solid var(--theme-border2);height:44px;min-height:44px;padding:0;flex-shrink:0;">
  <span style="padding-left:1rem;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;color:var(--theme-muted);">Ink</span>
</div>
<div style="display:flex;flex-direction:column;min-height:0;">
  {{with .Live}}
  <button
    class="sidebar__file ink-sidebar__item ink-sidebar__item--live"
    data-ink-live="{{if .Waiting}}waiting{{else}}live{{end}}"{{if .Active}}
    data-active{{end}}
    style="padding-left:{{fileIndent 0}};"
    onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
    title="{{if .Waiting}}Waiting for the tablet{{else}}The tablet is writing{{end}}{{if .Note}}: {{.Note}}{{end}}"
  >
    {{template "ink_live_icon"}}
    <span class="ink-sidebar__text">
      <span class="ink-sidebar__label">Live{{if .Device}} · {{.Device}}{{end}}</span>
      <span class="ink-sidebar__meta">{{if .Waiting}}Waiting for the tablet{{else if .Note}}{{.Note}}{{else}}Untitled note{{end}}</span>
    </span>
  </button>
  {{end}}
  {{if not .Notes}}
  <div class="sidebar__empty">No synced notes yet</div>
  {{else}}
  {{range .Notes}}
  <button
    class="sidebar__file ink-sidebar__item"
    data-ink-note="{{.UUID}}"{{if .Active}}
    data-active{{end}}
    style="padding-left:{{fileIndent 0}};"
    onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
  >
    {{template "ink_note_icon"}}
    <span class="ink-sidebar__label">{{.Title}}</span>
    <span class="ink-sidebar__meta ink-sidebar__meta--count">{{.Pages}} {{if eq .Pages 1}}page{{else}}pages{{end}}</span>
  </button>
  {{end}}
  {{end}}
</div>{{end}}{{end}}
