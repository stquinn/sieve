{{define "ink_note_icon"}}<svg class="ink-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>{{end}}
{{define "ink_whiteboard_icon"}}<svg class="ink-icon ink-icon--whiteboard" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4"/><path d="M8 20h8"/><path d="M7 12l3-3 2 2 4-4"/></svg>{{end}}
{{define "ink_live_icon"}}<svg class="ink-icon ink-icon--live" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.24 7.76a6 6 0 0 1 0 8.48"/><path d="M7.76 16.24a6 6 0 0 1 0-8.48"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>{{end}}
{{define "ink_sidebar.html"}}{{if .Enabled}}<button
  class="ink-tree__row"
  style="padding-left:{{indent 0}};"
  aria-expanded="{{if .Open}}true{{else}}false{{end}}"
  hx-patch="/api/folder/{{.ID}}"
  hx-vals='{"open": {{if .Open}}false{{else}}true{{end}}}'
  hx-target="#htmx-sidebar"
  hx-swap="innerHTML"
  hx-push-url="false"
  title="Notebooks: the notebooks synced from your tablets"
>
  <span class="ink-tree__chevron">
    {{if .Open}}
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    {{else}}
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    {{end}}
  </span>
  {{template "ink_note_icon"}}
  <span class="ink-tree__name">Notebooks</span>
  {{if and (not .Open) .Live}}{{if not .Live.Waiting}}<span class="ink-tree__live-dot" data-ink-live-dot title="The tablet is writing"></span>{{end}}{{end}}
</button>
{{if .Open}}
{{with .Live}}
<button
  class="sidebar__file ink-tree__item ink-tree__item--live"
  data-ink-live="{{if .Waiting}}waiting{{else}}live{{end}}"
  data-ctx-id="{{.UUID}}"
  data-ctx-type="inkLive"
  data-ctx-name="Live{{if .Device}} · {{.Device}}{{end}}"{{if .Active}}
  data-active{{end}}
  style="padding-left:{{fileIndent 1}};"
  onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
  title="{{if .Waiting}}Waiting for the tablet{{else}}The tablet is writing{{end}}{{if .Note}}: {{.Note}}{{end}}"
>
  {{template "ink_live_icon"}}
  <span class="ink-tree__text">
    <span class="ink-tree__label">Live{{if .Device}} · {{.Device}}{{end}}</span>
    <span class="ink-tree__meta">{{if .Waiting}}Waiting for the tablet{{else if .Note}}{{.Note}}{{else}}Untitled notebook{{end}}</span>
  </span>
</button>
{{end}}
{{if not .Notes}}
<div class="sidebar__empty" style="padding-left:{{fileIndent 1}};">No synced notebooks yet</div>
{{else}}
{{range .Notes}}
<button
  class="sidebar__file ink-tree__item"
  data-ink-note="{{.UUID}}"{{if .Whiteboard}}
  data-ink-whiteboard{{end}}{{if .Absent}}
  data-ink-absent{{end}}
  data-ctx-id="{{.UUID}}"
  data-ctx-type="notebook"{{if .DeleteRefused}}
  data-ctx-delete-refused="{{.DeleteRefused}}"{{end}}
  data-ctx-name="{{.Title}}"{{if .Active}}
  data-active{{end}}
  style="padding-left:{{fileIndent 1}};"
  onmousedown="window.sieveWorkspace.open('{{.UUID}}')"
  title="{{if .Whiteboard}}Whiteboard: {{end}}{{.Title}}{{if .Absent}} (not on the tablet: deleted there or no longer shared){{end}}"
>
  {{if .Whiteboard}}{{template "ink_whiteboard_icon"}}{{else}}{{template "ink_note_icon"}}{{end}}
  <span class="ink-tree__label">{{.Title}}</span>
  {{if .Absent}}<span class="ink-tree__absent">not on tablet</span>{{end}}
  <span class="ink-tree__meta ink-tree__meta--count">{{.Pages}} {{if eq .Pages 1}}page{{else}}pages{{end}}</span>
</button>
{{end}}
{{end}}
{{end}}{{end}}{{end}}
