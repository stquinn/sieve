{{define "create_folder.html"}}
<div class="rename-modal" style="padding: 1.5rem; background: var(--theme-bgDark); border-radius: 8px;">
  <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--theme-text); margin-bottom: 1rem;">Create New Folder</h3>
  
  <form 
    hx-post="/api/folder"
    hx-target="#htmx-sidebar"
    hx-swap="innerHTML"
    onsubmit="document.getElementById('rename-dialog').close()"
    style="display: flex; flex-direction: column; gap: 1rem;"
  >
    <div>
      <input 
        type="text" 
        name="name" 
        value="" 
        id="create-folder-input"
        placeholder="Folder Name"
        autofocus 
        onfocus="this.select()"
        style="width: 100%; background: var(--theme-bg); border: 1px solid var(--theme-border); border-radius: 0.5rem; padding: 0.6rem 1rem; color: var(--theme-text); outline: none; font-size: 0.875rem;"
      >
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 0.5rem;">
      <button 
        type="button" 
        onclick="document.getElementById('rename-dialog').close()" 
        style="padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: 500; color: var(--theme-textDim); background: transparent; border: none; cursor: pointer;"
      >
        Cancel
      </button>
      <button 
        type="submit" 
        style="padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: bold; color: #ffffff; background: var(--theme-accentPrimary); border-radius: 0.5rem; border: none; cursor: pointer;"
      >
        Create
      </button>
    </div>
  </form>
</div>
<script>
setTimeout(function() {
  var input = document.getElementById('create-folder-input');
  if (input) {
    input.focus();
    input.select();
  }
}, 50);
</script>
{{end}}
