{{define "delete.html"}}
<div class="delete-modal" style="padding: 1.5rem; background: var(--theme-bgDark); border-radius: 8px;">
  <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--theme-accentRed); margin-bottom: 1rem;">Delete {{if eq .Type "folder"}}Folder{{else}}Note{{end}}</h3>
  
  <p style="font-size: 0.875rem; color: var(--theme-text); margin-bottom: 1.5rem; line-height: 1.4;">
    Are you sure you want to delete <strong>{{.Name}}</strong>? 
    {{if eq .Type "folder"}}It must be empty.{{else}}This cannot be undone.{{end}}
  </p>

  <form 
    {{if eq .Type "folder"}}
      hx-post="/api/sidebar/delete-folder?id={{.ID}}"
    {{else}}
      hx-post="/api/sidebar/delete-note?id={{.ID}}"
    {{end}}
    hx-target="#htmx-sidebar"
    hx-swap="innerHTML"
    onsubmit="document.getElementById('delete-dialog').close(); if ('{{.Type}}' === 'note') { window.sieveWorkspace.close('{{.ID}}'); }"
    style="display: flex; justify-content: flex-end; gap: 1rem;"
  >
    <button 
      type="button" 
      onclick="document.getElementById('delete-dialog').close()" 
      style="padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: 500; color: var(--theme-textDim); background: transparent; border: none; cursor: pointer;"
    >
      Cancel
    </button>
    <button 
      type="submit" 
      style="padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: bold; color: #ffffff; background: var(--theme-accentRed); border-radius: 0.5rem; border: none; cursor: pointer;"
    >
      Delete
    </button>
  </form>
</div>
{{end}}
