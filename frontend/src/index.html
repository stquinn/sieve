<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sieve</title>
    <!-- Self-hosted fonts, first so faces are declared before any stylesheet
         asks for them. Replaces a Google Fonts fetch of Inter that never
         resolved here (no TLS backend in WebKitGTK) and was referenced by
         nothing. See fonts.css. -->
    <link rel="stylesheet" href="/ui/static/fonts.css">
    <link rel="stylesheet" href="/ui/static/tailwind.css">
    <link rel="stylesheet" href="/ui/theme.css">
    <link rel="stylesheet" href="/ui/static/sidebar.css">
    <link rel="stylesheet" href="/ui/static/editor.css">
    <link rel="stylesheet" href="/ui/static/shell.css">
    <link rel="stylesheet" href="/ui/static/settings.css">
    <style id="layout-overrides-sidebar">
        #app-root { --sidebar-w: {{if .ShowSidebar}}{{.SidebarWidth}}{{else}}0{{end}}px !important; }
        #htmx-sidebar { display: {{if .ShowSidebar}}flex{{else}}none{{end}} !important; }
        .sidebar-handle { display: {{if .ShowSidebar}}block{{else}}none{{end}} !important; }
    </style>
    <style id="layout-overrides-meta">
        #app-root { --meta-w: {{if .ShowMeta}}{{.MetaWidth}}{{else}}0{{end}}px !important; }
        #htmx-meta-panel { display: {{if .ShowMeta}}flex{{else}}none{{end}} !important; }
        .meta-handle { display: {{if .ShowMeta}}block{{else}}none{{end}} !important; }
    </style>
    <style id="layout-overrides-askpanel">
        {{if .ShowAskPanel}}#ask-panel { display: flex !important; position: relative; z-index: 20; }{{end}}
    </style>
    <script id="askpanel-state-sync">
        window.initAskPanelPinned = {{if .ShowAskPanel}}true{{else}}false{{end}};
    </script>
    <style id="layout-overrides-prompts">
        #prompts-panel { display: {{if .ShowPrompts}}block{{else}}none{{end}}; }
        .prompts-handle { display: {{if .ShowPrompts}}block{{else}}none{{end}}; }
    </style>
    <style id="layout-overrides-toolbar">
        #editor-toolbar { display: {{if .ShowToolbar}}flex{{else}}none{{end}}; }
        #app-root { --toolbar-h: {{if .ShowToolbar}}36px{{else}}0px{{end}}; }
    </style>
    <style id="layout-overrides-linenumbers">{{if not .ShowLineNumbers}}.block-chrome-host, .tiptap::before { display: none !important; } .tiptap { padding-left: 1.25rem !important; }{{end}}</style>
</head>
<body>
    {{if .StoreRoot}}
    <div id="app-root" class="theme-{{.ThemeName}} tier-{{.Tier}}" style="--sidebar-w: {{if .ShowSidebar}}{{.SidebarWidth}}{{else}}0{{end}}px; --meta-w: {{if .ShowMeta}}{{.MetaWidth}}{{else}}0{{end}}px; --wails-drop-target: drop;">
        
        <div id="sidebar-wrapper" style="width: var(--sidebar-w); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; border-right: 1px solid var(--theme-border);">
            <div id="htmx-sidebar" class="sidebar" style="flex: 1; min-height: 0; border-right: none; display: flex; flex-direction: column;" hx-get="/ui/views/sidebar" hx-trigger="load, sieve:invalidate-session from:document, sieve:invalidate-notes from:document, session:changed from:body, notes:changed from:body"></div>
            <div class="prompts-handle"></div>
            <div id="prompts-panel" style="height: {{.PromptsHeight}}px; flex-shrink: 0;" hx-get="/ui/views/prompts" hx-trigger="load, sieve:invalidate-prompts from:document, sieve:invalidate-notes from:document, prompts:changed from:body, notes:changed from:body"></div>
        </div>
        <div class="sidebar-handle"></div>

        <div id="right-panel">
            <!-- Bare mount: the Workspace owns the tab strip render — it boots the
                 first load and refetches on session/notes invalidation
                 (shell/workspace.js loadTabs), so this div carries no
                 hx-get/hx-trigger of its own. -->
            <div id="htmx-tabbar" class="flex items-stretch bg-tn-bg-dark border-0 border-t border-b border-solid border-tn-border-2 h-[44px] shrink-0"></div>

            <dialog id="settings-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="settings-dialog-content" style="background: var(--theme-bgDark); width: min(90vw, 1200px); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="help-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="help-dialog-content" style="background: var(--theme-bgDark); width: 90vw; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="rename-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="rename-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="delete-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="delete-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="restore-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="restore-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="quickswitcher-dialog" style="background: transparent; border: none; padding: 0; outline: none; margin: 15vh auto auto;">
                <div id="quickswitcher-dialog-content" style="background: var(--theme-bgDark); width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <!-- Main toolbar — visibility and --toolbar-h controlled by #layout-overrides-toolbar style tag.
                 P4.D: the toolbar is EDITOR-owned — NoteEditor's EditorToolbar renders its buttons into
                 this host on the first present (the inner button DOM was removed). The hidden image-input
                 stays here (the toolbar image button + the cross-file upload handler both reach it by id). -->
            <div id="editor-toolbar"></div>
            <input id="tb-attach-input" type="file" style="display:none">

            <!-- Table toolbar — appears below main toolbar when cursor is inside a table -->
            <div id="table-toolbar">
              <div class="tb-label" style="display:flex; align-items:center; gap:6px; color: var(--theme-accentCyan); padding-left: 6px; padding-right: 8px;">
                <span style="width: 14px; height: 14px; display: flex;" data-icon="table"></span>
                TABLE TOOLS
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="addColumnBefore" data-icon="tableColumnPlusLeft" title="Insert column before"></button>
                <button class="tb-btn" data-cmd="addColumnAfter"  data-icon="tableColumnPlusRight" title="Insert column after"></button>
                <button class="tb-btn tb-danger" data-cmd="deleteColumn" data-icon="tableColumnRemove" title="Delete column"></button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="addRowBefore"    data-icon="tableRowPlusTop" title="Insert row above"></button>
                <button class="tb-btn" data-cmd="addRowAfter"     data-icon="tableRowPlusBottom" title="Insert row below"></button>
                <button class="tb-btn tb-danger" data-cmd="deleteRow" data-icon="tableRowRemove" title="Delete row"></button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="toggleHeaderRow" data-icon="tableHeader" title="Toggle header row"></button>
                <button class="tb-btn" data-cmd="mergeOrSplit"    data-icon="tableMerge" title="Merge / split cells"></button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn tb-danger" data-cmd="deleteTable" data-icon="trash" title="Delete entire table"></button>
              </div>
            </div>

            <div class="editor-area">
                <!-- #editor-col wraps the editor scroller + ask panel so the panel
                     is naturally constrained to editor width (meta panel excluded) -->
                <div id="editor-col" style="flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0;">
                    <div id="htmx-editor" class="editor-wrapper" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;">
                        <div id="tiptap-mount" class="editor-panel" data-uuid="{{.ActiveUUID}}" data-mode="wysiwyg" style="flex: 1; min-height: 0; display: flex; flex-direction: column;"></div>
                    </div>

                    <!-- Ask AI panel — persistent, resizable, at the bottom of the editor column.
                         The panel itself paints nothing: it is a transparent resize
                         region, and the writing box floats inside it. Height persists
                         via /api/session/layout. -->
                    <div id="ask-panel" class="ask-panel {{if .ShowAskPanel}}is-open{{end}}" style="height: {{.AskPanelHeight}}px;">
                        <!-- The writing box: body + chips + footer read as ONE
                             bounded, elevated unit, and it is what carries the focus
                             ring (:focus-within — the caret is in a contentEditable
                             the panel never sees). The drag handle is its first
                             child — grabbing the box's own top edge — so it shows/
                             hides with the box (no JS toggle). -->
                        <div class="ask-composer">
                            <div class="ask-handle"></div>
                            <div class="ask-popup__input"></div>
                            <div class="ask-popup__footer">
                                <button class="ask-popup__send">Send</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="meta-handle"></div>
                <div id="htmx-meta-panel" style="width: {{.MetaWidth}}px;" class="flex flex-col flex-shrink-0 overflow-hidden bg-tn-bg-dark border-l border-tn-border text-base" hx-get="/ui/views/meta" hx-vals='js:{"tab": window.__metaActiveTab || "meta"}' hx-trigger="load, sieve:invalidate-session from:document, sieve:invalidate-notes from:document, session:changed from:body, notes:changed from:body"></div>
            </div>

            <div class="status-bar">
                <!-- Dedicated, non-overlapping slots: each owner writes only
                     into its own element, so no update can clobber another.
                       __lib     — library chip       (GET /ui/views/library/current)
                       __jobs    — AI job spinner      (ai-actions.js updateStatusBar)
                       __save    — save indicator      (editor:saved handler)
                       __blockid — hovered block kind·id (editor:blockhover handler)
                       __stats   — document stats       (editor:stats handler) -->
                <div class="status-bar__left">
                  <div class="status-bar__lib" hx-get="/ui/views/library/current" hx-trigger="load" hx-swap="innerHTML"></div>
                  <div class="status-bar__jobs"></div>
                  <div class="status-bar__command-badges"></div>
                </div>
                <div class="status-bar__right flex items-center">
                  <div class="status-bar__save" style="margin-right: 8px; color: var(--theme-muted); transition: opacity 0.5s; opacity: 0;"></div>
                  <div class="status-bar__blockid" style="width: 160px; flex: none; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--theme-muted); font-family: var(--theme-monoFont); font-size: 11px;"></div>
                  <div class="status-bar__stats flex items-center"></div>
                </div>
            </div>

            <div id="pending-close-overlay" class="pending-close-backdrop" style="display: none;">
                <div class="pending-close-dialog">
                    <svg class="pending-close-spinner animate-spin text-tn-accent-cyan" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="color: var(--theme-accentCyan);">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <div class="pending-close-title">Closing...</div>
                    <div class="pending-close-body">Waiting for AI background tasks to finish</div>
                </div>
            </div>
        </div>
    </div>
    {{else}}
    <div class="bootstrap-screen">
        <div class="bootstrap-card">
            <h1>Welcome to Sieve</h1>
            <p>Sieve is an AI-augmented knowledge base. To begin, select an existing store or create a new one.</p>
            
            <div class="bootstrap-manual">
                <p style="font-size: 0.9rem; margin-bottom: 0.5rem;">Initialize a store in a specific path:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="manual-path" class="bootstrap-input" placeholder="~/Documents/notes" style="flex: 1;">
                    <button class="btn btn--primary" onclick="sieveInitManual()">Init</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.sieveSelectVault = async function() {
            try {
                const path = await window.go.main.App.SelectVault();
                if (path) window.location.reload();
            } catch (e) {
                console.error(e);
            }
        };
        window.sieveCreateVault = async function() {
            try {
                const path = await window.go.main.App.CreateVault();
                if (path) window.location.reload();
            } catch (e) {
                console.error(e);
            }
        };
        window.sieveInitManual = async function() {
            const path = document.getElementById('manual-path').value;
            if (path) {
                try {
                    await window.go.main.App.InitVault(path);
                    window.location.reload();
                } catch (e) {
                    alert(e);
                }
            }
        };
    </script>
    {{end}}

    <!-- Scripts -->
    <script src="/ui/static/vendor/htmx-bundle.js"></script>
    <script src="/ui/static/vendor/tiptap.js"></script>
    <script src="/ui/static/vendor/js-yaml.js"></script>
    <script src="/ui/static/vendor/panzoom.min.js"></script>
    <script src="/ui/static/base/icons.js"></script>
    <script type="module" src="/ui/static/lens/extensions.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/ai-target.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/paste-context.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/block-chrome.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/ai-target-decoration.js"></script>
    <script type="module" src="/ui/static/renderers/block-kinds.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/interaction-policy.js"></script>
    <script type="module" src="/ui/static/renderers/action-label.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/sieve-block-extension.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/reference-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/ai-block-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/code-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/log-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/web-clip-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/smart-image-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/smart-card-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/node-views/diagram-node-view.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/prose-markers.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/block-render.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/block-sync.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/prose-block.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/prose-group.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/block-position.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/surfaces/render-empty.js"></script>
    <script type="module" src="/ui/static/base/globals.js"></script>
    <!-- Shell skeleton (P1: Workspace/Tab/Editor component model). Dual-use ES
         modules: type="module" is MANDATORY — a plain <script> tag fails at
         parse on `export` silently and takes every dependent path down.
         Modules execute deferred (after classic scripts parse); editor.js only
         reads window.sieveWorkspace / window.SieveEditor at runtime (initEditor
         via DOMContentLoaded/htmx events), never at parse time, so ordering is safe. -->
    <script type="module" src="/ui/static/lens/document-editor/editor-shell.js"></script>
    <script type="module" src="/ui/static/shell/tab.js"></script>
    <script type="module" src="/ui/static/shell/workspace.js"></script>
    <script src="/ui/static/ai/ai-actions.js"></script>
    <script src="/ui/static/ui/tabbar.js"></script>
    <script src="/ui/static/ui/sidebar.js"></script>
    <script type="module" src="/ui/static/lens/document-editor/context-menu.js"></script>
    <script src="/ui/static/ui/layout.js"></script>

    <script>
    window.__sieveDevServerPort = {{.DevServerPort}};
    // This run's WebSocket upgrade credential (#83). Both wires ride the loopback
    // listener, which every local process can reach; presenting this on the
    // handshake is what tells this page apart from one of them.
    window.__sieveWsToken = "{{.WSToken}}";
    // The user's attachment ceiling (#84). The drop path refuses an over-limit
    // file BEFORE it reads it, so it has to know the number Go would enforce
    // rather than carry a constant of its own that can drift from the setting.
    window.__sieveMaxAttachmentBytes = {{.MaxAttachmentBytes}};

    window.isMod = function(e) {
        if (!e) return false;
        return navigator.platform.includes('Mac') ? e.metaKey : e.ctrlKey;
    };

    window.sieveSidebarSearch = function() {
        var treeInput = document.getElementById('sidebar-search-input');
        if (treeInput) { treeInput.focus(); treeInput.select(); return; }
        var resultInput = document.querySelector('.store-search__input');
        if (resultInput) { resultInput.focus(); resultInput.select(); return; }
        if (window.htmx) window.htmx.ajax('GET', '/ui/views/sidebar/search?q=', { target: '#htmx-sidebar', swap: 'innerHTML' });
    };

    document.body.addEventListener('settings:changed', function() {
        var dlg = document.getElementById('settings-dialog');
        if (dlg) dlg.close();
        var link = document.querySelector('link[href^="/ui/theme.css"]');
        if (link) link.href = '/ui/theme.css?t=' + new Date().getTime();
    });

    // The sieve:meta-dirty consumer (save dot + status-bar save slot) lives in the
    // Workspace's StatusBar child (shell/status-bar.js); its producer is the
    // editor's own reaction to the container-saved fact.

    // Measure real tabbar height and expose as --tabbar-h for the gutter separator.
    // The active-tab -mb-[2px] trick makes the visual bottom slightly lower than
    // the CSS h-[44px] value, so we measure instead of hardcoding.
    function updateTabbarH() {
        var tabbar = document.getElementById('htmx-tabbar');
        var appRoot = document.getElementById('app-root');
        if (tabbar && appRoot) {
            appRoot.style.setProperty('--tabbar-h', Math.ceil(tabbar.getBoundingClientRect().bottom) + 'px');
        }
    }
    window.addEventListener('DOMContentLoaded', updateTabbarH);
    document.addEventListener('htmx:afterSettle', function(e) {
        if (e.detail && e.detail.target && e.detail.target.id === 'htmx-tabbar') updateTabbarH();
    });

    // Anchor the editor gutter rule (.tiptap::before) to the real top of the
    // editor area. The toolbar wraps to multiple rows on narrow windows, so its
    // height is dynamic; measuring #htmx-editor's viewport position means the
    // gutter always starts exactly below the toolbar — no summed-height guessing,
    // no overlap. Recomputed whenever the chrome could move (resize, wrap, toggle).
    function updateEditorTop() {
        var ed = document.getElementById('htmx-editor');
        var appRoot = document.getElementById('app-root');
        if (ed && appRoot) appRoot.style.setProperty('--editor-top', Math.round(ed.getBoundingClientRect().top) + 'px');
    }
    window.addEventListener('DOMContentLoaded', function() {
        updateEditorTop();
        // #htmx-editor is flex:1, so its height (and thus its top) changes whenever
        // any chrome above it changes — toolbar wrap, the table toolbar appearing,
        // or a bar toggling. Observing it alone catches every case that moves the
        // gutter anchor, including the table toolbar (which isn't an htmx swap).
        var ed = document.getElementById('htmx-editor');
        if (ed && window.ResizeObserver) new ResizeObserver(updateEditorTop).observe(ed);
    });
    window.addEventListener('resize', updateEditorTop);
    document.addEventListener('htmx:afterSettle', updateEditorTop);

    // Initial editor load
    window.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('[data-icon]').forEach(function(el) {
            var icon = window.SieveIcons && window.SieveIcons[el.getAttribute('data-icon')];
            if (icon) el.insertAdjacentHTML('afterbegin', icon);
        });
        document.querySelectorAll('[data-sieve-kind]').forEach(function(el) {
            var kind = el.getAttribute('data-sieve-kind');
            var icon = window.GLOBALS && window.GLOBALS.getSieveIcon(kind);
            if (icon) el.insertAdjacentHTML('afterbegin', icon);
        });

        var mount = document.getElementById('tiptap-mount');
        if (mount && mount.dataset.editorInit !== 'true') {
            var uuid = mount.getAttribute('data-uuid');
            var mode = mount.getAttribute('data-mode');
            if (uuid) {
                mount.dataset.editorInit = 'true';
                console.log('[index.html] Initializing editor from DOMContentLoaded for:', uuid);
                window.sieveWorkspace?.initEditor(mount, uuid, mode);
            }
        }
    });

    window.__sieveAutosaveMs = function() {
        var ms = {{.AutosaveDebounce}} * 1000;
        return ms > 0 ? ms : 30000;
    };

    window.__sieveCliTimeoutLong = {{.CLITimeoutLong}};

    window.__sieveSpellcheckEnabled = {{.SpellcheckEnabled}};

    window.__sieveCommands = {{.Commands}};

    window.__metaActiveTab = 'meta';

    function metaPanelUrl(uuid) {
        return '/ui/views/meta?uuid=' + encodeURIComponent(uuid) + '&tab=' + (window.__metaActiveTab || 'meta');
    }

    document.addEventListener('htmx:afterSettle', function(e) {
        var target = e.detail && e.detail.target;
        if (target && target.id === 'htmx-meta-panel') {
            var root = target.querySelector('[data-active-tab]');
            if (root) window.__metaActiveTab = root.getAttribute('data-active-tab') || 'meta';
        }
    });

    // Refetches the meta panel, but only when it is showing the document that
    // changed and only when it is on screen. A null uuid means "some document's
    // metadata changed and the signal does not say which" — the panel only ever
    // shows the active one, so refreshing it is the whole of the correct answer.
    function refreshMetaPanelFor(uuid) {
        var metaPanel = document.getElementById('htmx-meta-panel');
        var mount = document.getElementById('tiptap-mount');
        var activeUuid = mount ? mount.getAttribute('data-uuid') : null;
        if (!activeUuid || (uuid && uuid !== activeUuid)) return;
        if (!metaPanel || !window.htmx || window.getComputedStyle(metaPanel).display === 'none') return;
        window.htmx.ajax('GET', metaPanelUrl(activeUuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
    }

    document.addEventListener('editor:saved', function(e) {
        refreshMetaPanelFor(e.detail && e.detail.uuid);
    });

    // TWO SIGNALS, ONE SUBJECT (see Workspace.startTabbar): intent:changed is the
    // HX-Trigger on the response, so the client that clicked sees its own change
    // immediately; sieve:invalidate-intent is the broadcast fact, so every OTHER
    // window hears it too. The push carries a topic and no uuid — topics are the
    // vocabulary, uuids are not — hence the null.
    document.addEventListener('intent:changed', function(e) {
        refreshMetaPanelFor(e.detail && e.detail.uuid);
    });
    document.addEventListener('sieve:invalidate-intent', function() {
        refreshMetaPanelFor(null);
    });


    // P4.D: the editor:stats + editor:blockhover consumers (status-bar __stats /
    // __blockid slots) moved into the Workspace's StatusBar child. The stats
    // PRODUCER is now the editor's `stats` stream event (the StatusBar subscribes
    // to the active editor's onEvent); the blockhover producer (editor.js
    // mouseover) stays a DOM CustomEvent until P4.F.

    // Listen for HTMX load to re-init editor if mount changes
    window.__sieveFocusTimer = null;
    window.__sieveDwellInterval = null;
    window.__sieveActiveDocUuid = null;
    window.__sieveLastActivity = Date.now();

    (function() {
        function recordActivity() { window.__sieveLastActivity = Date.now(); }
        // keydown: no passive — webkit2 suppresses preventDefault() in subsequent handlers
        // if capture-phase listener is marked passive, breaking TipTap's Ctrl+S handler
        document.addEventListener('keydown',   recordActivity, { capture: true });
        document.addEventListener('mousemove', recordActivity, { passive: true, capture: true });
        document.addEventListener('scroll',    recordActivity, { passive: true, capture: true });
        document.addEventListener('click',     recordActivity, { passive: true, capture: true });
    })();

    // Arm (or clear) per-document focus-count tracking. Must run on EVERY editor
    // (re)init — both htmx:load and the in-place library switch — otherwise the
    // previous document's dwell interval keeps firing bumpFocus and POSTs focus
    // pings for a stale UUID against the newly-switched library. Pass a falsy uuid
    // to just tear the timers down (e.g. switching to an empty library).
    window.__sieveArmFocusTracking = function(uuid) {
        if (window.__sieveFocusTimer) clearTimeout(window.__sieveFocusTimer);
        if (window.__sieveDwellInterval) clearInterval(window.__sieveDwellInterval);
        window.__sieveFocusTimer = null;
        window.__sieveDwellInterval = null;
        window.__sieveActiveDocUuid = uuid || null;
        if (!uuid) return;
        window.__sieveLastActivity = Date.now(); // tab switch is itself activity

        var IDLE_THRESHOLD_MS = 3 * 60 * 1000; // 3 minutes
        var bumpFocus = function() {
            if (window.__sieveActiveDocUuid !== uuid) return;
            if (Date.now() - window.__sieveLastActivity > IDLE_THRESHOLD_MS) return;
            // The dwell ping is a document-wire frame the server never answers, so
            // there is nothing to await: refresh the panel straight after sending.
            // The count it shows is one ping behind until the next refresh, which
            // is the honest cost of an unanswered signal and beneath noticing for
            // a counter that moves every five minutes.
            window.sieveWorkspace?.documentService?.focus(uuid);
            var mp = document.getElementById('htmx-meta-panel');
            if (mp && window.getComputedStyle(mp).display !== 'none') {
                window.htmx.ajax('GET', metaPanelUrl(uuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
            }
        };
        window.__sieveFocusTimer = setTimeout(bumpFocus, 30 * 1000);
        window.__sieveDwellInterval = setInterval(bumpFocus, 5 * 60 * 1000);
    };

    document.addEventListener('htmx:load', function(e) {
        var mount = document.getElementById('tiptap-mount');
        if (mount && mount.dataset.editorInit !== 'true') {
            var uuid = mount.getAttribute('data-uuid');
            var mode = mount.getAttribute('data-mode');
            if (uuid) {
                mount.dataset.editorInit = 'true';
                console.log('[index.html] Initializing editor from htmx:load for:', uuid);
                window.sieveWorkspace?.initEditor(mount, uuid, mode);
                window.__sieveArmFocusTracking(uuid);
            }
        }
    });

    // Re-trigger layout parameters on sidebar changes
    document.addEventListener('htmx:afterSettle', function(e) {
        var target = e.detail && e.detail.target;
        if (!target) return;
        if (target.id === 'htmx-sidebar' || (target.closest && target.closest('#htmx-sidebar'))) {
            window.sieveWorkspace.loadTabs();
            var mount = document.getElementById('tiptap-mount');
            var activeUuid = mount ? mount.getAttribute('data-uuid') : null;
            var metaPanel = document.getElementById('htmx-meta-panel');
            if (activeUuid && metaPanel && window.htmx && window.getComputedStyle(metaPanel).display !== 'none') {
                window.htmx.ajax('GET', metaPanelUrl(activeUuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
            }
        }
    });
    </script>

    <script>
    // ── Library switch safety wrappers ────────────────────────────────────────
    // Mirrors the app:closing flow: waits for active AI jobs, flushes the
    // editor, then delegates to the Go binding. All library-switch entry points
    // (menu, chip) go through one of these two functions.

    // Shared library-switch refresh: updates all HTMX panels and reinitialises
    // the editor in place — no location.reload() so WebKit never reinstalls its
    // SIGSEGV handler, avoiding the "non-Go code set up signal handler" panic.
    async function sieveApplyLibrarySwitch() {
      // 1. Layout style overrides (sidebar/meta/toolbar/prompts visibility + widths).
      await htmx.ajax('GET', '/ui/views/session/layout', { swap: 'none' });

      // 2. Refresh all library-specific panels in parallel.
      await Promise.all([
        htmx.ajax('GET', '/ui/views/sidebar', { target: '#htmx-sidebar',    swap: 'innerHTML' }),
        window.sieveWorkspace.loadTabs(),
        htmx.ajax('GET', '/ui/views/meta',    { target: '#htmx-meta-panel', swap: 'innerHTML' }),
        htmx.ajax('GET', '/ui/views/prompts', { target: '#prompts-panel',   swap: 'innerHTML' }),
      ]);

      // 3. Reinitialise editor for the new library's active document.
      var newUUID = await window.go.main.App.GetActiveUUID();
      var mount = document.getElementById('tiptap-mount');
      if (mount) {
        if (newUUID) {
          mount.setAttribute('data-uuid', newUUID);
          mount.setAttribute('data-mode', 'wysiwyg');
          // Claim the mount BEFORE init (not delete) so a late htmx:load — e.g. the
          // redundant tab-strip reload fired by the sidebar afterSettle handler —
          // cannot re-enter initEditor while our async document load is in flight.
          // Deleting the flag opened a window for a second editor to mount on top
          // of this one, leaving artefacts from the old document.
          mount.dataset.editorInit = 'true';
          window.sieveWorkspace?.initEditor(mount, newUUID, 'wysiwyg');
        } else {
          mount.setAttribute('data-uuid', '');
          mount.dataset.editorInit = 'true';
          // Route teardown through initEditor (uuid='') so it closes the previous
          // document's editor WebSocket and resets editor.js module state. Calling
          // __tiptap.destroy() directly skips closeEditorWs() and leaks the socket.
          window.sieveWorkspace?.initEditor(mount, '', 'wysiwyg');
        }
        // Re-arm focus tracking for the new active doc (or clear it). The htmx:load
        // handler that normally does this is suppressed here by editorInit='true'.
        window.__sieveArmFocusTracking(newUUID || '');
      }
    }

    // Shared job-wait + editor-flush preamble.
    async function sieveWaitAndFlush() {
      var overlay = document.getElementById('pending-close-overlay');
      var overlayTitle = overlay && overlay.querySelector('.pending-close-title');
      var overlayBody  = overlay && overlay.querySelector('.pending-close-body');
      await new Promise(function(resolve) {
        function check() {
          if (window.__sieveActiveJobs > 0) {
            if (overlay) overlay.style.display = 'flex';
            if (overlayTitle) overlayTitle.textContent = 'Switching library…';
            if (overlayBody)  overlayBody.textContent  = 'Waiting for AI tasks to finish';
            setTimeout(check, 500);
          } else { resolve(); }
        }
        check();
      });
      window.sieveWorkspace?.flushSave();
      await new Promise(function(r) { setTimeout(r, 300); });
    }

    window.sieveSwitchLibrary = async function(path) {
      var overlay = document.getElementById('pending-close-overlay');
      await sieveWaitAndFlush();
      try {
        var result = await window.go.main.App.SwitchLibrary(path);
        if (result) await sieveApplyLibrarySwitch();
      } catch (e) {
        console.error('[sieve] SwitchLibrary failed', e);
        alert('Could not switch to that library:\n' + e);
      } finally {
        if (overlay) overlay.style.display = 'none';
      }
    };

    window.sieveSelectLibrary = async function() {
      var overlay = document.getElementById('pending-close-overlay');
      await sieveWaitAndFlush();
      try {
        var path = await window.go.main.App.SelectVault();
        if (path) await sieveApplyLibrarySwitch();
      } catch (e) {
        console.error('[sieve] SelectVault failed', e);
      } finally {
        if (overlay) overlay.style.display = 'none';
      }
    };

    // Close Handler
    window.addEventListener('DOMContentLoaded', function() {

        // ── Table toolbar command dispatch ──────────────────────────────────────
        // P4.D: the MAIN toolbar is EDITOR-owned (EditorToolbar — buttons carry
        // their own click closures, no delegation). The #table-toolbar is left
        // static this phase, so its delegated command dispatch stays here (table
        // commands run on window.__tiptap — the icon bus retires in P4.E).
        function handleTableToolbarClick(e) {
          var btn = e.target.closest('button,[data-cmd]');
          if (!btn) return;
          var editor = window.__tiptap;
          if (!editor) return;
          var c = editor.chain().focus();
          switch (btn.dataset.cmd) {
            case 'addColumnBefore': c.addColumnBefore().run(); break;
            case 'addColumnAfter':  c.addColumnAfter().run(); break;
            case 'deleteColumn':    c.deleteColumn().run(); break;
            case 'addRowBefore':    c.addRowBefore().run(); break;
            case 'addRowAfter':     c.addRowAfter().run(); break;
            case 'deleteRow':       c.deleteRow().run(); break;
            case 'toggleHeaderRow': c.toggleHeaderRow().run(); break;
            case 'mergeOrSplit':    c.mergeOrSplit().run(); break;
            case 'deleteTable':     c.deleteTable().run(); break;
          }
        }
        var tableToolbar = document.getElementById('table-toolbar');
        if (tableToolbar) {
          tableToolbar.addEventListener('mousedown', function(e) {
            if (e.target.closest('button,[data-cmd]')) e.preventDefault();
          });
          tableToolbar.addEventListener('click', handleTableToolbarClick);
        }

        // ── Toolbar file attach ─────────────────────────────────────────────────
        // No kind is named here: the entry carries the file's mime type and Go's
        // paste-match registry routes it (image/* -> smart-image, else reference).
        // The ceiling is the user's `max_attachment_bytes` setting (#84), published
        // by the index template; the fallback mirrors domain.DefaultMaxAttachmentBytes.
        // Read PER CHECK, not captured at load: settings change under a running window.
        var tbAttachmentCeiling = function() {
          var configured = Number(window.__sieveMaxAttachmentBytes);
          return (isFinite(configured) && configured > 0) ? configured : 25 * 1024 * 1024;
        };
        document.getElementById('tb-attach-input')?.addEventListener('change', function(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          // Refused BEFORE the read, so an enormous file never enters memory, and
          // never silently: the message names the file, its size and the limit.
          if (file.size > tbAttachmentCeiling()) {
            var mb = function(n) { return (n / (1024 * 1024)).toFixed(1) + ' MB'; };
            window.alert('"' + file.name + '" is ' + mb(file.size) + ' \u2014 larger than the '
              + mb(tbAttachmentCeiling()) + ' limit for an attached file, so it was not attached.');
            e.target.value = '';
            return;
          }
          var ws = window.sieveWorkspace;
          if (!ws || !window.__tiptap) return;
          var reader = new FileReader();
          reader.onload = function(ev) {
            if (!ev.target || !ev.target.result) return;
            // Use the ANCHOR captured BEFORE the file dialog opened (the dialog
            // blurred the editor, so re-deriving the caret now would land at the end).
            // Reached through the Workspace rather than by importing anything: this
            // inline script is not a module. The created block arrives as a container
            // change, so there is nothing to act on here — only a failure.
            ws.attachFile(
              { mimeType: file.type, content: ev.target.result, filename: file.name },
              window.__sieveCapturedInsertAnchor
            ).catch(function(err) { console.error('[toolbar] file attach failed', err); });
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });

        // A drop anywhere the page has NOT claimed must never navigate the
        // webview — WebKit's default for browser-recognisable content would turn
        // the app shell into a file viewer (identical in dev and production).
        // The editor's own drop handling runs on its target first; this is the
        // page's last line, and calling preventDefault again on an
        // already-claimed drop is harmless.
        document.addEventListener('dragover', function(e) { e.preventDefault(); });
        document.addEventListener('drop', function(e) { e.preventDefault(); });

        if (window.runtime && window.runtime.EventsOn) {
            window.runtime.EventsOn('app:closing', function() {
                console.log('[stash] App closing, vetoed natively to allow flush.');
                // Liveness ack FIRST: tells Go's close watchdog a real app page
                // owns the shutdown (it may wait on jobs below as long as it
                // likes). A navigated-away page cannot make this call, which is
                // exactly when the watchdog should force the close instead.
                window.go?.main?.App?.ClosingAck?.();
                window.sieveWorkspace?.flushSave();
                
                function checkAndQuit() {
                    if (window.__sieveActiveJobs > 0) {
                        console.log('[stash] Waiting for AI jobs to finish...');
                        var overlay = document.getElementById('pending-close-overlay');
                        if (overlay) overlay.style.display = 'flex';
                        setTimeout(checkAndQuit, 500);
                    } else {
                        setTimeout(function() { window.go.main.App.Quit(); }, 300);
                    }
                }
                checkAndQuit();
            });
        }
    });
    </script>
</body>
</html>
