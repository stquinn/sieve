<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sieve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/static/sidebar.css">
    <link rel="stylesheet" href="/static/editor.css">
    <link rel="stylesheet" href="/static/shell.css">
    <link rel="stylesheet" href="/static/settings.css">
    <style id="layout-overrides-sidebar">
        #htmx-sidebar { display: {{if .ShowSidebar}}block{{else}}none{{end}}; }
        .sidebar-handle { display: {{if .ShowSidebar}}block{{else}}none{{end}}; }
    </style>
    <style id="layout-overrides-meta">
        #htmx-meta-panel { display: {{if .ShowMeta}}flex{{else}}none{{end}}; }
        .meta-handle { display: {{if .ShowMeta}}block{{else}}none{{end}}; }
    </style>
    <style id="layout-overrides-prompts">
        #prompts-panel { display: {{if .ShowPrompts}}block{{else}}none{{end}}; }
        .prompts-handle { display: {{if .ShowPrompts}}block{{else}}none{{end}}; }
    </style>
    <style id="layout-overrides-toolbar">
        #editor-toolbar { display: {{if .ShowToolbar}}flex{{else}}none{{end}}; }
        #app-root { --toolbar-h: {{if .ShowToolbar}}36px{{else}}0px{{end}}; }
    </style>
    <style id="layout-overrides-linenumbers">{{if not .ShowLineNumbers}}.tiptap > *::before, .tiptap::before { display: none !important; } .tiptap { padding-left: 1.25rem !important; }{{end}}</style>
</head>
<body hx-ext="sse" sse-connect="/sse">
    <!-- Relay: makes HTMX SSE extension register EventSource listeners so events bubble to document as sse:* -->
    <div id="ai-sse-relay" hx-trigger="sse:ai:block-resolved" style="display:none"></div>
    <div id="ai-job-started-relay" hx-trigger="sse:ai:job-started" style="display:none"></div>
    <div id="ai-job-ended-relay" hx-trigger="sse:ai:job-ended" style="display:none"></div>
    {{if .StoreRoot}}
    <div id="app-root" class="theme-{{.ThemeName}} tier-{{.Tier}}" style="--sidebar-w: {{if .ShowSidebar}}{{.SidebarWidth}}{{else}}0{{end}}px; --meta-w: {{if .ShowMeta}}{{.MetaWidth}}{{else}}0{{end}}px;">
        
        <div id="sidebar-wrapper" style="width: var(--sidebar-w); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; border-right: 1px solid var(--theme-border);">
            <div id="htmx-sidebar" class="sidebar" style="flex: 1; min-height: 0; border-right: none; display: flex; flex-direction: column;" hx-get="/api/sidebar" hx-trigger="load, sse:notes:changed, notes:changed from:body"></div>
            <div class="prompts-handle"></div>
            <div id="prompts-panel" style="height: {{.PromptsHeight}}px; flex-shrink: 0;" hx-get="/api/prompts" hx-trigger="load, sse:prompts:changed, sse:notes:changed, prompts:changed from:body, notes:changed from:body"></div>
        </div>
        <div class="sidebar-handle"></div>

        <div id="right-panel">
            <div id="htmx-tabbar" class="flex items-stretch bg-tn-bg-dark border-0 border-t border-b border-solid border-tn-border-2 h-[44px] shrink-0" hx-get="/api/tabs" hx-trigger="load, sse:session:changed, sse:notes:changed, session:changed from:body, notes:changed from:body"></div>

            <dialog id="settings-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="settings-dialog-content" style="background: var(--theme-bgDark); width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="help-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="help-dialog-content" style="background: var(--theme-bgDark); width: 90vw; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="rename-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="rename-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="delete-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="delete-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="restore-dialog" style="background: transparent; border: none; padding: 0; outline: none;">
                <div id="restore-dialog-content" style="background: var(--theme-bgDark); width: 450px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <dialog id="quickswitcher-dialog" style="background: transparent; border: none; padding: 0; outline: none; margin: 15vh auto auto;">
                <div id="quickswitcher-dialog-content" style="background: var(--theme-bgDark); width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.6);"></div>
            </dialog>

            <!-- Main toolbar — visibility and --toolbar-h controlled by #layout-overrides-toolbar style tag -->
            <div id="editor-toolbar">
              <!-- Text formatting -->
              <div class="tb-group">
                <button class="tb-btn" data-cmd="bold"    title="Bold (⌘B)"><b>B</b></button>
                <button class="tb-btn" data-cmd="italic"  title="Italic (⌘I)"><i>I</i></button>
                <button class="tb-btn" data-cmd="strike"  title="Strikethrough"><s>S</s></button>
                <button class="tb-btn" data-cmd="code"    title="Inline code" style="font-family:monospace">&lt;&gt;</button>
              </div>
              <div class="tb-sep"></div>
              <!-- Headings -->
              <div class="tb-group">
                <button class="tb-btn" data-cmd="h1" title="Heading 1" style="font-weight:800">H1</button>
                <button class="tb-btn" data-cmd="h2" title="Heading 2" style="font-weight:700">H2</button>
                <button class="tb-btn" data-cmd="h3" title="Heading 3" style="font-weight:600">H3</button>
              </div>
              <div class="tb-sep"></div>
              <!-- Lists -->
              <div class="tb-group">
                <button class="tb-btn" data-cmd="bulletList"  title="Bullet list">&#8801;</button>
                <button class="tb-btn" data-cmd="orderedList" title="Ordered list" style="font-size:10px">1.</button>
                <button class="tb-btn" data-cmd="taskList"    title="Task list">&#9745;</button>
              </div>
              <div class="tb-sep"></div>
              <!-- Block elements -->
              <div class="tb-group">
                <button class="tb-btn" data-cmd="blockquote"     title="Blockquote">&#8220;</button>
                <button class="tb-btn" data-cmd="insertTable"    title="Insert 3&#xD7;3 table" style="font-size:13px">&#8862;</button>
                <button class="tb-btn" data-cmd="horizontalRule" title="Horizontal rule">&#8212;</button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn"id="tb-toggle-mode-btn"       title="Toggle Editor Mode">
                    <span class="text-[12px] text-tn-blue font-bold font-mono bg-tn-bg-alt px-1.5 rounded shrink-0">M</span>
                </button>
              </div>
              <div class="tb-sep"></div>
              <!-- Insert content: blocks + AI query (left side, both teal and orange) -->
              <div class="tb-group">
                <button class="tb-btn tb-insert" data-insert="code"    title="Insert code block">{ } Code</button>
                <button class="tb-btn tb-insert" data-insert="diagram" title="Insert diagram">&#9671; Diagram</button>
                <button class="tb-btn tb-insert" id="tb-clip-btn"      title="Insert web clip">&#11041; Web Clip</button>
                <button class="tb-btn tb-insert" id="tb-image-btn"     title="Insert image from file">&#128444; Image</button>
                <input id="tb-image-input" type="file" accept="image/*" style="display:none">
              </div>
              <!-- AI query: Explain + Ask — orange, tier-gated, still on the left -->
              <div class="tb-group tb-ai-query">
                <button class="tb-btn tb-query" id="tb-explain-btn" title="Explain selection (⌘⇧X)">Explain</button>
                <button class="tb-btn tb-query" id="tb-ask-btn"     title="Ask about selection (⌘⇧A)">Ask</button>
              </div>
              <!-- Help -->
              <div class="tb-help">
                <button class="tb-btn" id="tb-help-btn" title="Help (&#8984;/)">?</button>
              </div>
            </div>

            <!-- Table toolbar — appears below main toolbar when cursor is inside a table -->
            <div id="table-toolbar">
              <span class="tb-label">Table</span>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="addColumnBefore" title="Insert column before">&#8677; Col</button>
                <button class="tb-btn" data-cmd="addColumnAfter"  title="Insert column after">Col &#8676;</button>
                <button class="tb-btn" data-cmd="deleteColumn"    title="Delete column">&#10005; Col</button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="addRowBefore"    title="Insert row above">&#8679; Row</button>
                <button class="tb-btn" data-cmd="addRowAfter"     title="Insert row below">Row &#8681;</button>
                <button class="tb-btn" data-cmd="deleteRow"       title="Delete row">&#10005; Row</button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn" data-cmd="toggleHeaderRow" title="Toggle header row">Header</button>
                <button class="tb-btn" data-cmd="mergeOrSplit"    title="Merge / split cells">Merge</button>
              </div>
              <div class="tb-sep"></div>
              <div class="tb-group">
                <button class="tb-btn tb-danger" data-cmd="deleteTable" title="Delete entire table">&#10005; Table</button>
              </div>
            </div>

            <div class="editor-area">
                <div id="htmx-editor" class="editor-wrapper" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;">
                    <div id="tiptap-mount" class="editor-panel" data-uuid="{{.ActiveUUID}}" data-mode="wysiwyg" style="flex: 1; min-height: 0; display: flex; flex-direction: column;"></div>
                </div>

                <div class="meta-handle"></div>
                <div id="htmx-meta-panel" style="width: {{.MetaWidth}}px;" class="flex flex-col flex-shrink-0 overflow-hidden bg-tn-bg-dark border-l border-tn-border text-base" hx-get="/api/meta" hx-vals='js:{"tab": window.__metaActiveTab || "meta"}' hx-trigger="load, sse:session:changed, sse:notes:changed, session:changed from:body, notes:changed from:body"></div>
            </div>

            <div class="status-bar">
                <!-- Three dedicated, non-overlapping slots: each owner writes only
                     into its own element, so no update can clobber another.
                       __lib   — library chip   (GET /api/library/current)
                       __jobs  — AI job spinner (ai-actions.js updateStatusBar)
                       __right — document stats  (editor:stats handler) -->
                <div class="status-bar__left">
                  <div class="status-bar__lib" hx-get="/api/library/current" hx-trigger="load" hx-swap="innerHTML"></div>
                  <div class="status-bar__jobs"></div>
                </div>
                <div class="status-bar__right"></div>
            </div>

            <div id="pending-close-overlay" class="pending-close-backdrop" style="display: none;">
                <div class="pending-close-dialog">
                    <svg class="pending-close-spinner animate-spin text-tn-accent-cyan" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="color: var(--theme-accentCyan);">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <div class="pending-close-title">Closing...</div>
                    <div class="pending-close-body">Waiting for AI background tasks to finish</div>
                </div>
            </div>
        </div>
    </div>
    {{else}}
    <div class="bootstrap-screen">
        <div class="bootstrap-card">
            <h1>Welcome to Sieve</h1>
            <p>Sieve is an AI-augmented knowledge base. To begin, select an existing store or create a new one.</p>
            
            <div class="bootstrap-manual">
                <p style="font-size: 0.9rem; margin-bottom: 0.5rem;">Initialize a store in a specific path:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="manual-path" class="bootstrap-input" placeholder="~/Documents/notes" style="flex: 1;">
                    <button class="btn btn--primary" onclick="sieveInitManual()">Init</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.sieveSelectVault = async function() {
            try {
                const path = await window.go.main.App.SelectVault();
                if (path) window.location.reload();
            } catch (e) {
                console.error(e);
            }
        };
        window.sieveCreateVault = async function() {
            try {
                const path = await window.go.main.App.CreateVault();
                if (path) window.location.reload();
            } catch (e) {
                console.error(e);
            }
        };
        window.sieveInitManual = async function() {
            const path = document.getElementById('manual-path').value;
            if (path) {
                try {
                    await window.go.main.App.InitVault(path);
                    window.location.reload();
                } catch (e) {
                    alert(e);
                }
            }
        };
    </script>
    {{end}}

    <!-- Scripts -->
    <script src="/static/vendor/htmx-bundle.js"></script>
    <script src="/static/vendor/tiptap.js"></script>
    <script src="/static/vendor/js-yaml.js"></script>
    <script src="/static/extensions.js"></script>
    <script type="module" src="/static/sieve-block-extension.js"></script>
    <script type="module" src="/static/ai-block-renderer.js"></script>
    <script type="module" src="/static/code-renderer.js"></script>
<script type="module" src="/static/web-clip-renderer.js"></script>
    <script type="module" src="/static/smart-link-renderer.js"></script>
    <script type="module" src="/static/smart-image-renderer.js"></script>
    <script type="module" src="/static/smart-card-renderer.js"></script>
    <script type="module" src="/static/diagram-renderer.js"></script>
    <script src="/static/editor.js"></script>
    <script src="/static/ai-actions.js"></script>
    <script src="/static/tabbar.js"></script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/context-menu.js"></script>
    <script src="/static/layout.js"></script>

    <script>
    window.__sieveDevServerPort = {{.DevServerPort}};

    window.isMod = function(e) {
        if (!e) return false;
        return navigator.platform.includes('Mac') ? e.metaKey : e.ctrlKey;
    };

    window.sieveSidebarSearch = function() {
        var treeInput = document.getElementById('sidebar-search-input');
        if (treeInput) { treeInput.focus(); treeInput.select(); return; }
        var resultInput = document.querySelector('.store-search__input');
        if (resultInput) { resultInput.focus(); resultInput.select(); return; }
        if (window.htmx) window.htmx.ajax('GET', '/api/sidebar/search?q=', { target: '#htmx-sidebar', swap: 'innerHTML' });
    };

    document.body.addEventListener('settings:changed', function() {
        var dlg = document.getElementById('settings-dialog');
        if (dlg) dlg.close();
        var link = document.querySelector('link[href^="/theme.css"]');
        if (link) link.href = '/theme.css?t=' + new Date().getTime();
    });

    // sieve:meta-dirty — dispatched by editor.js, updates the save-state dot in the path crumb
    document.addEventListener('sieve:meta-dirty', function(e) {
        var dirty = e.detail && e.detail.dirty;
        var dot = document.getElementById('meta-dirty-dot');
        if (!dot) return;
        if (dirty) {
            dot.classList.remove('bg-tn-green');
            dot.classList.add('bg-tn-red');
        } else {
            dot.classList.remove('bg-tn-red');
            dot.classList.add('bg-tn-green');
        }
    });

    // Measure real tabbar height and expose as --tabbar-h for the gutter separator.
    // The active-tab -mb-[2px] trick makes the visual bottom slightly lower than
    // the CSS h-[44px] value, so we measure instead of hardcoding.
    function updateTabbarH() {
        var tabbar = document.getElementById('htmx-tabbar');
        var appRoot = document.getElementById('app-root');
        if (tabbar && appRoot) {
            appRoot.style.setProperty('--tabbar-h', Math.ceil(tabbar.getBoundingClientRect().bottom) + 'px');
        }
    }
    window.addEventListener('DOMContentLoaded', updateTabbarH);
    document.addEventListener('htmx:afterSettle', function(e) {
        if (e.detail && e.detail.target && e.detail.target.id === 'htmx-tabbar') updateTabbarH();
    });

    // Anchor the editor gutter rule (.tiptap::before) to the real top of the
    // editor area. The toolbar wraps to multiple rows on narrow windows, so its
    // height is dynamic; measuring #htmx-editor's viewport position means the
    // gutter always starts exactly below the toolbar — no summed-height guessing,
    // no overlap. Recomputed whenever the chrome could move (resize, wrap, toggle).
    function updateEditorTop() {
        var ed = document.getElementById('htmx-editor');
        var appRoot = document.getElementById('app-root');
        if (ed && appRoot) appRoot.style.setProperty('--editor-top', Math.round(ed.getBoundingClientRect().top) + 'px');
    }
    window.addEventListener('DOMContentLoaded', function() {
        updateEditorTop();
        // #htmx-editor is flex:1, so its height (and thus its top) changes whenever
        // any chrome above it changes — toolbar wrap, the table toolbar appearing,
        // or a bar toggling. Observing it alone catches every case that moves the
        // gutter anchor, including the table toolbar (which isn't an htmx swap).
        var ed = document.getElementById('htmx-editor');
        if (ed && window.ResizeObserver) new ResizeObserver(updateEditorTop).observe(ed);
    });
    window.addEventListener('resize', updateEditorTop);
    document.addEventListener('htmx:afterSettle', updateEditorTop);

    // Initial editor load
    window.addEventListener('DOMContentLoaded', function() {
        var mount = document.getElementById('tiptap-mount');
        if (mount && mount.dataset.editorInit !== 'true') {
            var uuid = mount.getAttribute('data-uuid');
            var mode = mount.getAttribute('data-mode');
            if (uuid) {
                mount.dataset.editorInit = 'true';
                console.log('[index.html] Initializing editor from DOMContentLoaded for:', uuid);
                window.sieveInitEditor?.(mount, uuid, mode);
            }
        }
    });

    window.__sieveAutosaveMs = function() {
        var ms = {{.AutosaveDebounce}} * 1000;
        return ms > 0 ? ms : 30000;
    };

    window.__sieveCliTimeoutLong = {{.CLITimeoutLong}};

    window.__metaActiveTab = 'meta';

    function metaPanelUrl(uuid) {
        return '/api/meta?uuid=' + encodeURIComponent(uuid) + '&tab=' + (window.__metaActiveTab || 'meta');
    }

    document.addEventListener('htmx:afterSettle', function(e) {
        var target = e.detail && e.detail.target;
        if (target && target.id === 'htmx-meta-panel') {
            var root = target.querySelector('[data-active-tab]');
            if (root) window.__metaActiveTab = root.getAttribute('data-active-tab') || 'meta';
        }
    });

    document.addEventListener('sieve:save', function() {
        if (window._editorSave) window._editorSave();
    });

    document.addEventListener('editor:saved', function(e) {
        var uuid = e.detail && e.detail.uuid;
        var metaPanel = document.getElementById('htmx-meta-panel');
        var mount = document.getElementById('tiptap-mount');
        var activeUuid = mount ? mount.getAttribute('data-uuid') : null;
        if (uuid && uuid === activeUuid && metaPanel && window.htmx && window.getComputedStyle(metaPanel).display !== 'none') {
            window.htmx.ajax('GET', metaPanelUrl(uuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
        }
    });

    document.addEventListener('intent:changed', function(e) {
        var uuid = e.detail && e.detail.uuid;
        var metaPanel = document.getElementById('htmx-meta-panel');
        var mount = document.getElementById('tiptap-mount');
        var activeUuid = mount ? mount.getAttribute('data-uuid') : null;
        if (uuid && uuid === activeUuid && metaPanel && window.htmx && window.getComputedStyle(metaPanel).display !== 'none') {
            window.htmx.ajax('GET', metaPanelUrl(uuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
        }
    });


    document.addEventListener('editor:stats', function(e) {
        var sbRight = document.querySelector('.status-bar__right');
        if (sbRight && e.detail) {
            sbRight.innerHTML = '<span title="Characters">' + (e.detail.chars || 0) + ' chars</span>' +
                                '<span class="status-bar__sep">|</span>' +
                                '<span title="Lines">' + (e.detail.lines || 0) + ' lines</span>';
        }
    });

    // Listen for HTMX load to re-init editor if mount changes
    window.__sieveFocusTimer = null;
    window.__sieveDwellInterval = null;
    window.__sieveActiveDocUuid = null;
    window.__sieveLastActivity = Date.now();

    (function() {
        function recordActivity() { window.__sieveLastActivity = Date.now(); }
        // keydown: no passive — webkit2 suppresses preventDefault() in subsequent handlers
        // if capture-phase listener is marked passive, breaking TipTap's Ctrl+S handler
        document.addEventListener('keydown',   recordActivity, { capture: true });
        document.addEventListener('mousemove', recordActivity, { passive: true, capture: true });
        document.addEventListener('scroll',    recordActivity, { passive: true, capture: true });
        document.addEventListener('click',     recordActivity, { passive: true, capture: true });
    })();

    // Arm (or clear) per-document focus-count tracking. Must run on EVERY editor
    // (re)init — both htmx:load and the in-place library switch — otherwise the
    // previous document's dwell interval keeps firing bumpFocus and POSTs focus
    // pings for a stale UUID against the newly-switched library. Pass a falsy uuid
    // to just tear the timers down (e.g. switching to an empty library).
    window.__sieveArmFocusTracking = function(uuid) {
        if (window.__sieveFocusTimer) clearTimeout(window.__sieveFocusTimer);
        if (window.__sieveDwellInterval) clearInterval(window.__sieveDwellInterval);
        window.__sieveFocusTimer = null;
        window.__sieveDwellInterval = null;
        window.__sieveActiveDocUuid = uuid || null;
        if (!uuid) return;
        window.__sieveLastActivity = Date.now(); // tab switch is itself activity

        var IDLE_THRESHOLD_MS = 3 * 60 * 1000; // 3 minutes
        var bumpFocus = function() {
            if (window.__sieveActiveDocUuid !== uuid) return;
            if (Date.now() - window.__sieveLastActivity > IDLE_THRESHOLD_MS) return;
            fetch('/api/note/focus/' + encodeURIComponent(uuid), { method: 'POST' })
                .then(function() {
                    var mp = document.getElementById('htmx-meta-panel');
                    if (mp && window.getComputedStyle(mp).display !== 'none') {
                        window.htmx.ajax('GET', metaPanelUrl(uuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
                    }
                })
                .catch(console.error);
        };
        window.__sieveFocusTimer = setTimeout(bumpFocus, 30 * 1000);
        window.__sieveDwellInterval = setInterval(bumpFocus, 5 * 60 * 1000);
    };

    document.addEventListener('htmx:load', function(e) {
        var mount = document.getElementById('tiptap-mount');
        if (mount && mount.dataset.editorInit !== 'true') {
            var uuid = mount.getAttribute('data-uuid');
            var mode = mount.getAttribute('data-mode');
            if (uuid) {
                mount.dataset.editorInit = 'true';
                console.log('[index.html] Initializing editor from htmx:load for:', uuid);
                window.sieveInitEditor?.(mount, uuid, mode);
                window.__sieveArmFocusTracking(uuid);
            }
        }
    });

    // Re-trigger layout parameters on sidebar changes
    document.addEventListener('htmx:afterSettle', function(e) {
        var target = e.detail && e.detail.target;
        if (!target) return;
        if (target.id === 'htmx-sidebar' || (target.closest && target.closest('#htmx-sidebar'))) {
            window.htmx.ajax('GET', '/api/tabs', { target: '#htmx-tabbar', swap: 'innerHTML' });
            var mount = document.getElementById('tiptap-mount');
            var activeUuid = mount ? mount.getAttribute('data-uuid') : null;
            var metaPanel = document.getElementById('htmx-meta-panel');
            if (activeUuid && metaPanel && window.htmx && window.getComputedStyle(metaPanel).display !== 'none') {
                window.htmx.ajax('GET', metaPanelUrl(activeUuid), { target: '#htmx-meta-panel', swap: 'innerHTML' });
            }
        }
    });
    </script>

    <script>
    // ── Library switch safety wrappers ────────────────────────────────────────
    // Mirrors the app:closing flow: waits for active AI jobs, flushes the
    // editor, then delegates to the Go binding. All library-switch entry points
    // (menu, chip) go through one of these two functions.

    // Shared library-switch refresh: updates all HTMX panels and reinitialises
    // the editor in place — no location.reload() so WebKit never reinstalls its
    // SIGSEGV handler, avoiding the "non-Go code set up signal handler" panic.
    async function sieveApplyLibrarySwitch() {
      // 1. Layout style overrides (sidebar/meta/toolbar/prompts visibility + widths).
      await htmx.ajax('GET', '/api/library/switch-layout', { swap: 'none' });

      // 2. Refresh all library-specific panels in parallel.
      await Promise.all([
        htmx.ajax('GET', '/api/sidebar',  { target: '#htmx-sidebar',   swap: 'innerHTML' }),
        htmx.ajax('GET', '/api/tabs',     { target: '#htmx-tabbar',    swap: 'innerHTML' }),
        htmx.ajax('GET', '/api/meta',     { target: '#htmx-meta-panel', swap: 'innerHTML' }),
        htmx.ajax('GET', '/api/prompts',  { target: '#prompts-panel',  swap: 'innerHTML' }),
      ]);

      // 3. Reinitialise editor for the new library's active document.
      var newUUID = await window.go.main.App.GetActiveUUID();
      var mount = document.getElementById('tiptap-mount');
      if (mount) {
        if (newUUID) {
          mount.setAttribute('data-uuid', newUUID);
          mount.setAttribute('data-mode', 'wysiwyg');
          // Claim the mount BEFORE init (not delete) so a late htmx:load — e.g. the
          // redundant /api/tabs reload fired by the sidebar afterSettle handler —
          // cannot re-enter sieveInitEditor while our async /api/editor/load is in
          // flight. Deleting the flag opened a window for a second editor to mount
          // on top of this one, leaving artefacts from the old document.
          mount.dataset.editorInit = 'true';
          window.sieveInitEditor?.(mount, newUUID, 'wysiwyg');
        } else {
          mount.setAttribute('data-uuid', '');
          mount.dataset.editorInit = 'true';
          // Route teardown through initEditor (uuid='') so it closes the previous
          // document's editor WebSocket and resets editor.js module state. Calling
          // __tiptap.destroy() directly skips closeEditorWs() and leaks the socket.
          window.sieveInitEditor?.(mount, '', 'wysiwyg');
        }
        // Re-arm focus tracking for the new active doc (or clear it). The htmx:load
        // handler that normally does this is suppressed here by editorInit='true'.
        window.__sieveArmFocusTracking(newUUID || '');
      }
    }

    // Shared job-wait + editor-flush preamble.
    async function sieveWaitAndFlush() {
      var overlay = document.getElementById('pending-close-overlay');
      var overlayTitle = overlay && overlay.querySelector('.pending-close-title');
      var overlayBody  = overlay && overlay.querySelector('.pending-close-body');
      await new Promise(function(resolve) {
        function check() {
          if (window.__sieveActiveJobs > 0) {
            if (overlay) overlay.style.display = 'flex';
            if (overlayTitle) overlayTitle.textContent = 'Switching library…';
            if (overlayBody)  overlayBody.textContent  = 'Waiting for AI tasks to finish';
            setTimeout(check, 500);
          } else { resolve(); }
        }
        check();
      });
      if (window._editorSave) window._editorSave();
      await new Promise(function(r) { setTimeout(r, 300); });
    }

    window.sieveSwitchLibrary = async function(path) {
      var overlay = document.getElementById('pending-close-overlay');
      await sieveWaitAndFlush();
      try {
        var result = await window.go.main.App.SwitchLibrary(path);
        if (result) await sieveApplyLibrarySwitch();
      } catch (e) {
        console.error('[sieve] SwitchLibrary failed', e);
        alert('Could not switch to that library:\n' + e);
      } finally {
        if (overlay) overlay.style.display = 'none';
      }
    };

    window.sieveSelectLibrary = async function() {
      var overlay = document.getElementById('pending-close-overlay');
      await sieveWaitAndFlush();
      try {
        var path = await window.go.main.App.SelectVault();
        if (path) await sieveApplyLibrarySwitch();
      } catch (e) {
        console.error('[sieve] SelectVault failed', e);
      } finally {
        if (overlay) overlay.style.display = 'none';
      }
    };

    // Close Handler
    window.addEventListener('DOMContentLoaded', function() {

        // ── Toolbar command dispatch ────────────────────────────────────────────
        // Single delegated handler covers both main toolbar and table toolbar
        function handleToolbarClick(e) {
          var btn = e.target.closest('button,[data-cmd],[data-insert],[data-ai]');
          if (!btn) return;

          // Special buttons by ID
          if (btn.id === 'tb-help-btn') {
            htmx.ajax('GET', '/api/help', { target: '#help-dialog-content', swap: 'innerHTML' })
                .then(function() { document.getElementById('help-dialog').showModal(); });
            return;
          }
          if (btn.id === 'tb-image-btn') {
            document.dispatchEvent(new CustomEvent('sieve:capture-insert-pos'));
            document.getElementById('tb-image-input').click();
            return;
          }
          if (btn.id === 'tb-toggle-mode-btn') {
            document.dispatchEvent(new CustomEvent('sieve:toggle-mode'));
            return;
          }
          
          if (btn.id === 'tb-clip-btn') {
            if (window._sieveOpenInternalize) window._sieveOpenInternalize();
            return;
          }
          if (btn.id === 'tb-explain-btn') {
            document.dispatchEvent(new CustomEvent('sieve:ai-explain'));
            return;
          }
          if (btn.id === 'tb-ask-btn') {
            document.dispatchEvent(new CustomEvent('sieve:ai-ask'));
            return;
          }

          if (btn.id === 'tb-ask-btn') {
            document.dispatchEvent(new CustomEvent('sieve:ai-ask'));
            return;
          }

          // AI filing actions
          var ai = btn.dataset.ai;
          if (ai && window.SieveAI) { window.SieveAI[ai](); return; }

          // Block inserts (code, diagram only — clip handled above)
          var insert = btn.dataset.insert;
          if (insert) {
            var editor = window.__tiptap;
            if (editor) editor.chain().focus().run();
            document.dispatchEvent(new CustomEvent('sieve:create-block', { detail: { kind: insert } }));
            return;
          }

          // TipTap formatting + table commands
          var editor = window.__tiptap;
          if (!editor) return;
          var c = editor.chain().focus();
          switch (btn.dataset.cmd) {
            case 'bold':           c.toggleBold().run(); break;
            case 'italic':         c.toggleItalic().run(); break;
            case 'strike':         c.toggleStrike().run(); break;
            case 'code':           c.toggleCode().run(); break;
            case 'h1':             c.toggleHeading({ level: 1 }).run(); break;
            case 'h2':             c.toggleHeading({ level: 2 }).run(); break;
            case 'h3':             c.toggleHeading({ level: 3 }).run(); break;
            case 'bulletList':     c.toggleBulletList().run(); break;
            case 'orderedList':    c.toggleOrderedList().run(); break;
            case 'taskList':       c.toggleTaskList().run(); break;
            case 'blockquote':     c.toggleBlockquote().run(); break;
            case 'insertTable':    c.insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(); break;
            case 'horizontalRule': c.setHorizontalRule().run(); break;
            // Table editing
            case 'addColumnBefore': c.addColumnBefore().run(); break;
            case 'addColumnAfter':  c.addColumnAfter().run(); break;
            case 'deleteColumn':    c.deleteColumn().run(); break;
            case 'addRowBefore':    c.addRowBefore().run(); break;
            case 'addRowAfter':     c.addRowAfter().run(); break;
            case 'deleteRow':       c.deleteRow().run(); break;
            case 'toggleHeaderRow': c.toggleHeaderRow().run(); break;
            case 'mergeOrSplit':    c.mergeOrSplit().run(); break;
            case 'deleteTable':     c.deleteTable().run(); break;
          }
        }
        var editorToolbar = document.getElementById('editor-toolbar');
        if (editorToolbar) {
          editorToolbar.addEventListener('mousedown', function(e) {
            if (e.target.closest('button,[data-cmd],[data-insert],[data-ai]')) e.preventDefault();
          });
          editorToolbar.addEventListener('click', handleToolbarClick);
        }
        var tableToolbar = document.getElementById('table-toolbar');
        if (tableToolbar) {
          tableToolbar.addEventListener('mousedown', function(e) {
            if (e.target.closest('button,[data-cmd]')) e.preventDefault();
          });
          tableToolbar.addEventListener('click', handleToolbarClick);
        }

        // ── Toolbar image upload ────────────────────────────────────────────────
        document.getElementById('tb-image-input')?.addEventListener('change', function(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var mount = document.getElementById('tiptap-mount');
          var uuid = mount && mount.getAttribute('data-uuid');
          // Only proceed when a real document (not a prompt) is active
          if (!uuid || uuid.startsWith('prompt:') || !window.__tiptap) return;
          var reader = new FileReader();
          reader.onload = function(ev) {
            if (!ev.target || !ev.target.result) return;
            fetch('/api/editor/smart-paste', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ uuid: uuid, entries: [{ mimeType: file.type, content: ev.target.result }] }),
            }).catch(function(err) { console.error('[toolbar] image upload failed', err); });
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });

        if (window.runtime && window.runtime.EventsOn) {
            window.runtime.EventsOn('app:closing', function() {
                console.log('[stash] App closing, vetoed natively to allow flush.');
                if (window._editorSave) window._editorSave();
                
                function checkAndQuit() {
                    if (window.__sieveActiveJobs > 0) {
                        console.log('[stash] Waiting for AI jobs to finish...');
                        var overlay = document.getElementById('pending-close-overlay');
                        if (overlay) overlay.style.display = 'flex';
                        setTimeout(checkAndQuit, 500);
                    } else {
                        setTimeout(function() { window.go.main.App.Quit(); }, 300);
                    }
                }
                checkAndQuit();
            });
        }
    });
    </script>
</body>
</html>
